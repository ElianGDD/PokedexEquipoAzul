<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <title>Pokémon's</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                background: #f0f8ff; /* azul claro */
                font-family: 'Comic Sans MS', cursive, sans-serif;
                color: #333;
                margin: 0;
                padding: 20px 0;
            }
            html, body {
                height: 100%;
                overflow-y: auto; /* Permite scroll vertical */
                margin: 0;
                padding: 0;
            }


            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 15px;
            }

            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                justify-content: center;
            }

            .col-4 {
                flex: 0 0 calc(33.333% - 20px);
                box-sizing: border-box;
            }

            @media (max-width: 768px) {
                .col-4 {
                    flex: 0 0 calc(50% - 20px);
                }
            }

            @media (max-width: 480px) {
                .col-4 {
                    flex: 0 0 100%;
                }
            }

            .card {
                border-radius: 15px;
                background: linear-gradient(135deg, #ffcb05 0%, #ff1c1c 100%);
                box-shadow: 0 4px 15px rgba(255, 28, 28, 0.5);
                color: white;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                cursor: pointer;
                border: 3px solid #3b4cca; /* azul pokémon */
            }

            .card:hover {
                transform: scale(1.05);
                box-shadow: 0 8px 25px rgba(255, 28, 28, 0.8);
            }

            .card-img-top {
                border-radius: 15px 15px 0 0;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
                background: white;
                padding: 10px;
                max-height: 180px;
                width: 100%;
                object-fit: contain;
            }

            .card-body {
                padding: 15px;
                background: rgba(255, 255, 255, 0.85);
                border-radius: 0 0 15px 15px;
                color: #333;
                text-align: center;
                font-weight: bold;
                font-size: 1.2rem;
                text-transform: capitalize;
                text-shadow: 1px 1px 2px #ff1c1c;
            }

            /* Vibrate effect on hover */
            .card-hover-vibrate:hover {
                animation: vibrate 0.3s linear 1;
            }

            @keyframes vibrate {
                0% {
                    transform: translate(0);
                }
                20% {
                    transform: translate(-1px, 1px);
                }
                40% {
                    transform: translate(-1px, -1px);
                }
                60% {
                    transform: translate(1px, 1px);
                }
                80% {
                    transform: translate(1px, -1px);
                }
                100% {
                    transform: translate(0);
                }
            }

            /* Pagination Buttons */
            .btn-toolbar {
                margin-top: 30px;
            }
            .btn-group .btn {
                margin: 0 5px;
                background-color: #3b4cca;
                border-color: #2a368f;
                color: white;
                font-weight: bold;
                border-radius: 8px;
                padding: 8px 16px;
                transition: background-color 0.3s ease;
            }
            .btn-group .btn:hover {
                background-color: #2a368f;
            }
        </style>
    </head>
    <body>
        <div class="container" layout:fragment="body">
            <div class="row">
                <div class="col-4" th:each="pokemon : ${pokemons.results}">
                    <div class="card card-hover-vibrate">
                        <img th:src="@{'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + ${#strings.substring(pokemon.url, 34, pokemon.url.length() - 1)} + '.png'}"
                             class="card-img-top" alt="Imagen de Pokémon" />
                        <div class="card-body">
                            <label th:text="${pokemon.name}"></label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mt-3 mb-3">
                <div class="btn-toolbar d-flex justify-content-center" role="toolbar" aria-label="Toolbar with button groups">
                    <div class="btn-group me-2" role="group" aria-label="First group">
                        <button type="button" class="btn btn-primary">1</button>
                        <button type="button" class="btn btn-primary">2</button>
                        <button type="button" class="btn btn-primary">3</button>
                        <button type="button" class="btn btn-primary">4</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
