<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Pokédex — Listado</title>

        <!-- Bootstrap + icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <style>
            .card-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }
            .poke-card {
                border-radius: 12px;
                overflow: hidden;
                cursor: pointer;
                color: #fff;
                box-shadow: 0 4px 16px rgba(0,0,0,0.1);
                transition: transform .2s;
            }
            .poke-card:hover {
                transform: translateY(-6px);
            }
            .poke-thumb {
                height: 160px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255,255,255,0.3);
            }
            .poke-thumb img {
                max-height: 100%;
                max-width: 100%;
                object-fit: contain;
            }
            .poke-meta {
                padding: 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .poke-name {
                font-size: 1rem;
                font-weight: 600;
                text-transform: capitalize;
            }
            .poke-id {
                font-size: 0.85rem;
                opacity: 0.9;
            }
            .type-badge {
                padding: 4px 8px;
                border-radius: 999px;
                font-size: .75rem;
                margin-left: 4px;
                text-transform: capitalize;
            }
        </style>
    </head>
    <body layout:fragment="body">
        <div class="container py-4">

            <nav class="navbar navbar-expand-lg shadow-sm rounded mb-3 px-3 py-2 sticky-top"
                 style="background-color: rgba(255, 0, 0, 0.85); border-radius: 0.75rem; z-index: 1030;">
                <div class="container-fluid flex-wrap">

                    Título y subtítulo 
                    <div class="d-flex flex-column me-auto text-white">
                        <h1 class="h4 mb-0 fw-bold">
                            Pokédex <small class="text-light fw-semibold">/ listado</small>
                        </h1>
                        <div class="small text-light">Buscar y filtrar — se mostrará una pantalla de carga solo la primera vez</div>
                    </div>

                    Total info 
                    <div class="text-end text-light ms-auto me-3 d-none d-md-block">
                        <div id="totalInfo" th:text="${pokemons.size} + ' Pokémon'">—</div>
                    </div>

                    Controles 
                    <form class="d-flex flex-wrap align-items-center gap-2 mt-3 mt-lg-0 w-100">
                        <!--Buscador--> 
                        <label class="text-white small">Buscar nombre</label>
                        <div class="input-group" style="min-width: 250px; max-width: 300px;">
                            <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
                            <input id="searchInput" class="form-control form-control-sm"
                                   placeholder="Buscar por nombre..."
                                   aria-label="Buscar pokémon">
                        </div>

                        <label>Filtro por distintos tipos</label>
                        <select id="typesMulti" class="form-select form-select-sm" multiple size="1" style="width:220px" aria-label="Filtro múltiple">
                            <option th:each="t : ${types}" th:value="${t.name}" th:text="${t.name}"></option>
                        </select>

                        <!--Página--> 
                        <label class="text-white small">Paginación</label>
                        <select id="pageSize" class="form-select form-select-sm" style="width:120px" aria-label="Tamaño de página">
                            <option value="8" th:selected="${tamanio == 8}">8 / pág</option>
                            <option value="12" th:selected="${tamanio == 12 or tamanio == null}">12 / pág</option>
                            <option value="24" th:selected="${tamanio == 24}">24 / pág</option>
                        </select>

                        <!--Navegación--> 
                        <!--                        <div class="ms-auto d-flex gap-2 align-items-center">
                                                    <div id="activeTypes" th:if="${tiposSeleccionados != null and !tiposSeleccionados.isEmpty()}"
                                                         class="text-dark small">
                                                        Tipos activos:
                                                        <span th:each="t : ${tiposSeleccionados}" class="badge bg-secondary me-1" th:text="${t}"></span>
                                                    </div>
                                                    <button id="prevBtn" class="btn btn-sm btn-outline-light"
                                                            aria-label="Anterior"
                                                            th:disabled="${pagina == null or pagina <= 0}">
                                                        <i class="bi bi-chevron-left"></i>
                                                    </button>
                                                    <span class="text-white small">Página <span th:text="${pagina+1}">1</span></span>
                                                    <button id="nextBtn" class="btn btn-sm btn-outline-light"
                                                            aria-label="Siguiente"
                                                            th:disabled="${pokemons == null or pokemons.size() < (tamanio ?: 12)}">
                                                        <i class="bi bi-chevron-right"></i>
                                                    </button>
                                                </div>-->
                    </form>
                </div>
            </nav>

            <!-- Cards -->
            <div class="card-grid">
                <div th:each="pokemon : ${pokemons}">
                    <div class="poke-card"
                         th:style="'background:linear-gradient(135deg,' + ${pokemon.colorPrimario} + ',' + ${pokemon.colorSecundario} + ');'"
                         th:onclick="'window.location.href=\'/pokemon/' + ${pokemon.id} + '\';'">

                        <div class="poke-thumb">
                            <img th:src="${pokemon.spriteUrl}" th:alt="${pokemon.nombre}">
                        </div>

                        <div class="poke-meta">
                            <div>
                                <div class="poke-name" th:text="${pokemon.nombre}">Nombre</div>
                                <div class="poke-id">#<span th:text="${pokemon.id}">001</span></div>
                            </div>
                            <div class="text-end">
                                <span th:each="tipo : ${pokemon.tipos}"
                                      class="type-badge"
                                      th:text="${tipo}"
                                      th:style="'background:'+${pokemon.coloresTipos[tipo]}"></span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
