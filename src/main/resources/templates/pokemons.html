<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Pokédex — Listado</title>

        <!-- Bootstrap + icons + jQuery -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <style>
            * {
                font-family: 'Poppins', sans-serif;
            }
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }
            .GrillaTarjetas {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
                margin-top: 30px;
            }
            .TarjetaPokemon {
                border-radius: 20px;
                overflow: hidden;
                cursor: pointer;
                color: #fff;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                transition: all 0.3s;
                position: relative;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
            }
            .TarjetaPokemon:hover {
                transform: translateY(-12px) scale(1.02);
                box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            }
            .MiniaturaPrevia {
                height: 180px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255,255,255,0.15);
            }
            .MiniaturaPrevia img {
                max-height: 120px;
                max-width: 120px;
                object-fit: contain;
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
                transition: transform 0.3s ease;
            }
            .MiniaturaPrevia,.MetadatosPokemon{
                position:relative;
                z-index:2;
            }
            .TarjetaPokemon:hover .MiniaturaPrevia img {
                transform: scale(1.1);
            }
            .MetadatosPokemon {
                padding: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgba(255,255,255,0.05);
            }
            .MetadatosPokemon h5 {
                margin: 0;
                font-size: 1.1rem;
                font-weight: 600;
                text-transform: capitalize;
            }
            .TextoSecundario {
                font-size: 0.85rem;
                opacity: 0.9;
                font-weight: 500;
            }
            .BadgeTipo {
                padding: 6px 12px;
                border-radius: 20px;
                font-size: 0.7rem;
                margin-left: 6px;
                text-transform: capitalize;
                color: #fff;
            }
            .navbar-custom {
                background: rgba(0,0,0,0.2) !important;
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255,255,255,0.1);
            }
            .form-control, .form-select {
                background: rgba(255,255,255,0.15);
                border: 1px solid rgba(255,255,255,0.2);
                color: #fff;
                border-radius: 12px;
            }
            .btn-custom {
                background: rgba(255,255,255,0.15);
                border: 1px solid rgba(255,255,255,0.2);
                color: #fff;
                border-radius: 12px;
            }
            .estado-info {
                background: rgba(255,255,255,0.1);
                border-radius: 15px;
                padding: 15px 20px;
                margin-top: 30px;
            }
            .no-results {
                text-align: center;
                padding: 60px 20px;
                color: rgba(255,255,255,0.7);
                font-size: 1.1rem;
            }
            .ElementoTarjeta {
                animation: fadeInUp 0.6s ease forwards;
                opacity: 0;
                transform: translateY(30px);
            }
            .BtnFavorito{
                position:absolute;
                top:.5rem;
                right:.5rem;
                z-index:10;
                pointer-events:auto;
            }
            @keyframes fadeInUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body layout:fragment="body">
        <div class="container py-4">

            <!-- Navbar con filtros -->
            <nav class="navbar navbar-expand-lg shadow-sm rounded mb-3 px-4 py-3 sticky-top navbar-custom">
                <div class="container-fluid flex-wrap">
                    <div class="d-flex flex-column me-auto text-white">
                        <h1 class="h3 mb-0 fw-bold"><i class="bi bi-controller me-2"></i>Pokédex <small class="text-light fw-normal opacity-75">/ explorador</small></h1>
                        <div class="small text-light opacity-75">Descubre y filtra tu Pokémon favorito</div>
                    </div>
                    <div class="text-end text-light ms-auto me-3 d-none d-md-block"><div id="InformacionTotal" class="fw-semibold">—</div></div>

                    <form class="d-flex flex-wrap align-items-center gap-3 mt-3 mt-lg-0 w-100">
                        <div class="d-flex flex-column">
                            <label class="text-white small mb-1 fw-medium">Buscar nombre</label>
                            <div class="input-group" style="min-width: 250px; max-width: 300px;">
                                <span class="input-group-text border-0"><i class="bi bi-search"></i></span>
                                <input id="CampoBusqueda" class="form-control form-control-sm border-0" placeholder="Ej: Pikachu, Charizard...">
                            </div>
                        </div>
                        <div class="d-flex flex-column">
                            <label class="text-white small">Filtro por distintos tipos</label>
                            <select id="SelectorTiposMultiples" class="form-select form-select-sm" multiple size="1" style="width:220px">
                                <option th:each="t : ${types}" th:value="${t.name}" th:text="${t.name}"></option>
                            </select>
                        </div>
                        <div class="d-flex flex-column">
                            <label class="text-white small mb-1 fw-medium">Por página</label>
                            <select id="TamanoPagina" class="form-select form-select-sm border-0" style="width:120px">
                                <option value="8">8 cards</option>
                                <option value="12" selected>12 cards</option>
                                <option value="24">24 cards</option>
                            </select>
                        </div>
                        <div class="ms-auto d-flex gap-2 align-items-end">
                            <button id="BotonAnterior" type="button" class="btn btn-sm btn-custom"><i class="bi bi-chevron-left"></i> Anterior</button>
                            <button id="BotonSiguiente" type="button" class="btn btn-sm btn-custom">Siguiente <i class="bi bi-chevron-right"></i></button>
                        </div>
                    </form>
                </div>
            </nav>

            <!-- Tarjetas -->
            <div class="GrillaTarjetas" id="ContenedorTarjetas"></div>

            <!-- Estado -->
            <div class="estado-info d-flex justify-content-between align-items-center text-white">
                <div id="InformacionPagina" class="fw-medium"><i class="bi bi-bookmarks me-2"></i>Página 1</div>
                <div class="fw-medium"><i class="bi bi-activity me-2"></i>Estado: <span id="EstadoCarga">listo</span></div>
            </div>
        </div>

        <!-- Scripts -->
    <th:block layout:fragment="scripts">

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            $(function () {
                // Refs
                const $Contenedor = $('#ContenedorTarjetas');
                const $CampoBusqueda = $('#CampoBusqueda');
                const $SelectorTiposMultiples = $('#SelectorTiposMultiples');
                const $TamanoPagina = $('#TamanoPagina');
                const $BotonAnterior = $('#BotonAnterior');
                const $BotonSiguiente = $('#BotonSiguiente');
                const $InformacionTotal = $('#InformacionTotal');
                const $InformacionPagina = $('#InformacionPagina');
                const $EstadoCarga = $('#EstadoCarga');

                // Estado
                let estado = {
                    nombre: '',
                    tipos: [],
                    pagina: 0,
                    tamanio: parseInt($TamanoPagina.val(), 10) || 12
                };
                let favoritos = new Set();
                let timeoutBusqueda;
                let reqActual = null;

                // Carga favoritos (JSON de sesión)
                async function cargarFavoritos() {
                    try {
                        const resp = await fetch('/api/favoritos/json', {cache: 'no-store', credentials: 'same-origin'});
                        favoritos = resp.ok ? new Set(await resp.json()) : new Set();
                    } catch {
                        favoritos = new Set();
                    }
                }

                // Carga listado
                async function cargarPokemons() {
                    $EstadoCarga.text('cargando...');
                    if (reqActual && reqActual.abort)
                        reqActual.abort();

                    const params = {
                        nombre: estado.nombre,
                        pagina: estado.pagina,
                        tamanio: estado.tamanio
                    };
                    if (estado.tipos.length)
                        params.tipos = estado.tipos;

                    try {
                        reqActual = $.ajax({
                            url: '/api/pokemons',
                            method: 'GET',
                            traditional: true,
                            data: params
                        });
                        const lista = await reqActual;
                        renderPokemons(lista);
                        $EstadoCarga.text('listo');
                    } catch (e) {
                        if (e?.statusText === 'abort')
                            return;
                        console.error(e);
                        $Contenedor.html('<div class="p-3 text-danger">Error al cargar.</div>');
                        $EstadoCarga.text('error');
                    } finally {
                        reqActual = null;
                    }
                }

                // Render
                function renderPokemons(lista) {
                    $Contenedor.empty();

                    if (!Array.isArray(lista) || lista.length === 0) {
                        $Contenedor.html('<div class="no-results w-100"><i class="bi bi-search"></i><div>No se encontraron Pokémon</div></div>');
                        $InformacionTotal.html('<i class="bi bi-collection me-1"></i>0 Pokémon');
                        $BotonSiguiente.prop('disabled', true);
                        return;
                    }

                    lista.forEach((el, index) => {
                        const numero = String(el?.id ?? 0).padStart(3, '0');
                        const tiposArr = Array.isArray(el?.tipos) ? el.tipos : [];
                        const colores = el?.coloresTipos || {};
                        const tipos = tiposArr.map(t => `<span class="BadgeTipo" style="background:${colores[t] || '#777'}">${t}</span>`).join('');
                        const esFavorito = favoritos.has(el.id);
                        const iconoFavorito = esFavorito ? 'bi-star-fill text-warning' : 'bi-star';
                        const titleFav = esFavorito ? 'Quitar de favoritos' : 'Agregar a favoritos';
                        const ariaPressed = esFavorito ? 'true' : 'false';

                        $Contenedor.append(`
        <div class="ElementoTarjeta" style="animation-delay:${(index * 0.1).toFixed(2)}s">
          <div class="TarjetaPokemon" style="background:linear-gradient(135deg,${el?.colorPrimario || '#667eea'},${el?.colorSecundario || '#764ba2'});">

            <button type="button" class="btn btn-link text-white fs-4 position-absolute top-0 end-0 m-2 BtnFavorito"
                    data-id="${el.id}" title="${titleFav}" aria-pressed="${ariaPressed}" aria-label="Favorito">
              <i class="bi ${iconoFavorito}"></i>
            </button>

            <div class="MiniaturaPrevia" role="link" tabindex="0" data-href="/pokemon/${el.id}">
              <img src="${el?.spriteUrl || ''}" alt="${el?.nombre || 'pokemon'}">
            </div>
            <div class="MetadatosPokemon" role="link" tabindex="0" data-href="/pokemon/${el.id}">
              <div>
                <h5>${el?.nombre || 'Desconocido'}</h5>
                <div class="TextoSecundario">#${numero}</div>
              </div>
              <div class="text-end">${tipos}</div>
            </div>
          </div>
        </div>
      `);
                    });

                    $InformacionTotal.html(`<i class="bi bi-collection me-1"></i>${lista.length} Pokémon`);
                    $InformacionPagina.html(`<i class="bi bi-bookmarks me-2"></i>Página ${estado.pagina + 1}`);
                    $BotonAnterior.prop('disabled', estado.pagina === 0);
                    $BotonSiguiente.prop('disabled', lista.length < estado.tamanio);

                    // Navegación por click/tecla
                    $('[data-href]').off('click keydown')
                            .on('click', function () {
                                location.href = $(this).data('href');
                            })
                            .on('keydown', function (e) {
                                if (e.key === 'Enter' || e.key === ' ') {
                                    e.preventDefault();
                                    $(this).trigger('click');
                                }
                            });
                }

                // Delegación fija de favoritos (una vez)
                const toggling = new Set();
                $Contenedor.on('click', '.BtnFavorito', async function (e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const $btn = $(this);
                    const id = Number($btn.data('id'));
                    if (!id || toggling.has(id))
                        return;
                    toggling.add(id);

                    const icon = $btn.find('i');
                    const adding = icon.hasClass('bi-star');
                    const url = adding ? `/api/favoritos/add/${id}` : `/api/favoritos/remove/${id}`;

                    $btn.prop('disabled', true);

                    try {
                        const r = await fetch(url, {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: {'X-Requested-With': 'XMLHttpRequest'}
                        });
                        if (!r.ok)
                            return;

                        if (adding) {
                            favoritos.add(id);
                            icon.removeClass('bi-star').addClass('bi-star-fill text-warning');
                            $btn.attr('title', 'Quitar de favoritos').attr('aria-pressed', 'true');
                        } else {
                            favoritos.delete(id);
                            icon.removeClass('bi-star-fill text-warning').addClass('bi-star');
                            $btn.attr('title', 'Agregar a favoritos').attr('aria-pressed', 'false');
                        }
                    } finally {
                        $btn.prop('disabled', false);
                        toggling.delete(id);
                    }
                });

                // Filtros/paginación
                $SelectorTiposMultiples.on('change', function () {
                    estado.tipos = Array.from(this.selectedOptions).map(o => o.value);
                    estado.pagina = 0;
                    cargarPokemons();
                });

                $CampoBusqueda.on('input', function () {
                    clearTimeout(timeoutBusqueda);
                    const valor = this.value.trim();
                    timeoutBusqueda = setTimeout(() => {
                        estado.nombre = valor;
                        estado.pagina = 0;
                        cargarPokemons();
                    }, 250);
                });

                $TamanoPagina.on('change', function () {
                    estado.tamanio = parseInt(this.value, 10) || 12;
                    estado.pagina = 0;
                    cargarPokemons();
                });

                $BotonAnterior.on('click', function () {
                    if (estado.pagina > 0) {
                        estado.pagina--;
                        cargarPokemons();
                    }
                });

                $BotonSiguiente.on('click', function () {
                    estado.pagina++;
                    cargarPokemons();
                });

                // Inicio
                (async function init() {
                    await cargarFavoritos();
                    await cargarPokemons();
                })();
            });
        </script>

    </th:block>
</body>
</html>
