<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Pokédex — Listado</title>

        <!-- Bootstrap + icons + jQuery -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <!-- Retro fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=VT323&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <style>
            :root{
                --pdx-red:#d62828;
                --pdx-red-2:#9b1717;
                --pdx-bezel:#1f232b;
                --pdx-lcd-1:#0e1912;
                --pdx-lcd-2:#0a130f;
                --pdx-green:#9ae66e;
                --pdx-yellow:#ffd34d;
                --pdx-silver:#c9d1d9;
                --radius:18px;
                --shadow:0 14px 34px rgba(0,0,0,.35);
            }

            *{
                box-sizing:border-box;
            }

            body{
                background:
                    radial-gradient(1200px 600px at -10% -20%, #2b3550 0%, transparent 60%),
                    radial-gradient(1000px 500px at 110% 120%, #53283f 0%, transparent 60%),
                    linear-gradient(135deg, #0b1220, #182232 55%, #261a2b);
                min-height:100vh;
                margin:0;
                color:#e8f1ec;
            }

            /* ======= NAVBAR “Pokedex panel” ======= */
            .navbar-custom{
                position:sticky;
                top:0;
                border-radius: var(--radius);
                padding: .85rem 1.25rem !important;
                background:
                    linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.22)) padding-box,
                    linear-gradient(180deg,#ffb4b4,#541010) border-box !important;
                border:2px solid transparent !important;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .navbar-custom::before,
            .navbar-custom::after{
                content:'';
                position:absolute;
                top:10px;
                width:12px;
                height:12px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #fff, #aaa 40%, #333 70%);
                box-shadow:0 0 0 2px rgba(0,0,0,.25);
                opacity:.9;
            }
            .navbar-custom::before{
                left:10px;
            }
            .navbar-custom::after{
                right:10px;
            }
            .navbar-custom .h3{
                font-family:'Orbitron', system-ui;
                letter-spacing:.5px;
            }
            .navbar-custom small{
                font-weight:700;
                letter-spacing:.4px;
                opacity:.85;
            }
            .navbar-custom .input-group,
            .navbar-custom .form-select{
                filter: drop-shadow(0 6px 10px rgba(0,0,0,.2));
            }

            /* Controls look like LCD widgets */
            .form-control, .form-select{
                background:
                    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
                    linear-gradient(180deg, var(--pdx-lcd-1), var(--pdx-lcd-2)) !important;
                border:1px solid #103221 !important;
                color:#c6ffd3 !important;
                border-radius:12px !important;
            }
            .input-group-text{
                background: linear-gradient(180deg,#0f261b,#08160f);
                color:#b9f5c2;
                border:1px solid #103221;
                border-right:0;
            }
            .btn-custom{
                border-radius:12px;
                background:
                    linear-gradient(180deg,#2b2f3a,#171a22);
                border:1px solid #0e1117;
                color:#e6edf3;
            }
            .btn-custom:hover{
                filter: brightness(1.08);
                transform: translateY(-1px);
            }

            /* ======= GRID / CARDS ======= */
            .GrillaTarjetas{
                display:grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 22px;
                margin-top: 26px;
            }

            .TarjetaPokemon{
                position:relative;
                border-radius:16px;
                color:#eaf6ef;
                cursor:pointer;
                border:2px solid transparent;
                box-shadow: var(--shadow);
                overflow:hidden;
                transition: transform .25s ease, box-shadow .25s ease;
                /* Inline gradient (tipo) vendrá desde JS – añadimos overlay LCD: */
            }
            .TarjetaPokemon::before{
                content:'';
                position:absolute;
                inset:0;
                background:
                    repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, transparent 1px 3px);
                mix-blend-mode: soft-light;
                opacity:.25;
                pointer-events:none;
            }
            .TarjetaPokemon::after{
                /* Bisel interior */
                content:'';
                position:absolute;
                inset:0;
                box-shadow: inset 0 0 0 2px rgba(255,255,255,.15), inset 0 0 0 6px rgba(0,0,0,.15);
                border-radius:16px;
                pointer-events:none;
            }
            .TarjetaPokemon:hover{
                transform: translateY(-8px);
                box-shadow: 0 18px 44px rgba(0,0,0,.45);
            }

            .MiniaturaPrevia{
                height: 190px;
                display:flex;
                align-items:center;
                justify-content:center;
                background:
                    repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px),
                    linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.22));
                position:relative;
                z-index:2;
            }
            .MiniaturaPrevia img{
                max-height: 130px;
                max-width: 130px;
                object-fit: contain;
                filter: drop-shadow(0 6px 12px rgba(0,0,0,.35));
                transition: transform .25s ease;
            }
            .TarjetaPokemon:hover .MiniaturaPrevia img{
                transform: scale(1.07) rotate(2deg);
            }

            .MetadatosPokemon{
                padding: 16px 16px 18px;
                display:flex;
                justify-content:space-between;
                align-items:center;
                background:
                    linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.35));
                border-top:1px solid rgba(255,255,255,.12);
                z-index:2;
                position:relative;
            }
            .MetadatosPokemon h5{
                margin:0;
                font-size:1.05rem;
                font-weight:800;
                text-transform:capitalize;
                letter-spacing:.4px;
                font-family:'Poppins', system-ui;
                text-shadow: 0 2px 6px rgba(0,0,0,.35);
            }
            .TextoSecundario{
                font-family:'VT323', monospace;
                font-size:1.05rem;
                letter-spacing:.5px;
                color:#d6ffd0;
                text-shadow:0 0 6px rgba(154,230,110,.25);
            }

            .BadgeTipo{
                display:inline-block;
                padding:6px 10px;
                border-radius:10px;
                font-size:.75rem;
                font-weight:700;
                text-transform:capitalize;
                color:#0b1014;
                background:#d0ffe0;
                border:1px solid rgba(0,0,0,.2);
                box-shadow: inset 0 -2px 0 rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.12);
                margin-left:6px;
            }

            /* ======= FAVORITE BUTTON (retro LED) ======= */
            .BtnFavorito{
                position:absolute;
                top:.5rem;
                right:.5rem;
                z-index:10;
                width:44px;
                height:44px;
                border-radius:50%;
                display:flex;
                align-items:center;
                justify-content:center;
                background:
                    radial-gradient(circle at 30% 30%, rgba(255,255,255,.65) 0 30%, transparent 31%),
                    linear-gradient(180deg,#2f3340,#191c25);
                border:1px solid #0d1016;
                box-shadow: inset 0 0 0 2px rgba(255,255,255,.06), 0 6px 14px rgba(0,0,0,.4);
                pointer-events:auto;
            }
            .BtnFavorito i.bi-star{
                color:#e6edf3;
                opacity:.8;
            }
            .BtnFavorito i.bi-star-fill{
                color: var(--pdx-yellow);
                text-shadow: 0 0 8px rgba(255,211,77,.4);
            }

            /* ======= STATUS BAR ======= */
            .estado-info{
                margin-top: 26px;
                border-radius: 14px;
                padding: 14px 18px;
                background:
                    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
                border:2px solid transparent;
                border-image: linear-gradient(180deg,#e9f1ff22,#00000055) 1;
                box-shadow: var(--shadow);
                font-family:'Orbitron',sans-serif;
                letter-spacing:.4px;
            }

            .no-results{
                text-align:center;
                padding: 60px 20px;
                color: #c8d6cf;
                font-size:1.05rem;
                background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.28));
                border:1px dashed rgba(255,255,255,.15);
                border-radius: 14px;
            }

            .ElementoTarjeta{
                animation: fadeInUp .6s ease forwards;
                opacity:0;
                transform: translateY(30px);
            }
            @keyframes fadeInUp{
                to{
                    opacity:1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>

    <body layout:fragment="body">
        <div class="container py-4">

            <!-- NAVBAR -->
            <nav class="navbar navbar-expand-lg shadow-sm rounded mb-3 px-4 py-3 sticky-top navbar-custom">
                <div class="container-fluid flex-wrap">
                    <div class="d-flex flex-column me-auto text-white">
                        <h1 class="h3 mb-0 fw-bold">
                            <i class="bi bi-controller me-2"></i>
                            Pokédex <small class="text-light fw-normal opacity-75">/ explorador</small>
                        </h1>
                        <div class="small text-light opacity-75">Descubre y filtra tu Pokémon favorito</div>
                    </div>

                    <div class="text-end text-light ms-auto me-3 d-none d-md-block">
                        <div id="InformacionTotal" class="fw-semibold">—</div>
                    </div>

                    <form class="d-flex flex-wrap align-items-center gap-3 mt-3 mt-lg-0 w-100">
                        <div class="d-flex flex-column">
                            <label class="text-white small mb-1 fw-medium">Buscar nombre</label>
                            <div class="input-group" style="min-width: 250px; max-width: 300px;">
                                <span class="input-group-text border-0"><i class="bi bi-search"></i></span>
                                <input id="CampoBusqueda" class="form-control form-control-sm border-0" placeholder="Ej: Pikachu, Charizard...">
                            </div>
                        </div>

                        <div class="d-flex flex-column">
                            <label class="text-white small">Filtro por distintos tipos</label>
                            <select id="SelectorTiposMultiples" class="form-select form-select-sm" multiple size="1" style="width:220px">
                                <option th:each="t : ${types}" th:value="${t.name}" th:text="${t.name}"></option>
                            </select>
                        </div>

                        <div class="d-flex flex-column">
                            <label class="text-white small mb-1 fw-medium">Por página</label>
                            <select id="TamanoPagina" class="form-select form-select-sm border-0" style="width:120px">
                                <option value="5">5 cards</option>
                                <option value="10" selected>10 cards</option>
                                <option value="20">20 cards</option>
                            </select>
                        </div>

                        <div class="ms-auto d-flex gap-2 align-items-end">
                            <button id="BotonAnterior" type="button" class="btn btn-sm btn-custom">
                                <i class="bi bi-chevron-left"></i> Anterior
                            </button>
                            <button id="BotonSiguiente" type="button" class="btn btn-sm btn-custom">
                                Siguiente <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </nav>

            <!-- GRID -->
            <div class="GrillaTarjetas" id="ContenedorTarjetas"></div>

            <!-- STATUS -->
            <div class="estado-info d-flex justify-content-between align-items-center text-white">
                <div id="InformacionPagina" class="fw-medium"><i class="bi bi-bookmarks me-2"></i>Página 1</div>
                <div class="fw-medium"><i class="bi bi-activity me-2"></i>Estado: <span id="EstadoCarga">listo</span></div>
            </div>
        </div>

        <!-- Scripts (lógica intacta) -->
    <th:block layout:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            $(function () {
                // Refs
                const $Contenedor = $('#ContenedorTarjetas');
                const $CampoBusqueda = $('#CampoBusqueda');
                const $SelectorTiposMultiples = $('#SelectorTiposMultiples');
                const $TamanoPagina = $('#TamanoPagina');
                const $BotonAnterior = $('#BotonAnterior');
                const $BotonSiguiente = $('#BotonSiguiente');
                const $InformacionTotal = $('#InformacionTotal');
                const $InformacionPagina = $('#InformacionPagina');
                const $EstadoCarga = $('#EstadoCarga');

                // Estado
                let estado = {
                    nombre: '',
                    tipos: [],
                    pagina: 0,
                    tamanio: parseInt($TamanoPagina.val(), 10) || 12
                };
                let favoritos = new Set();
                let timeoutBusqueda;
                let reqActual = null;

                async function cargarFavoritos() {
                    try {
                        const resp = await fetch('/api/favoritos/json', {cache: 'no-store', credentials: 'same-origin'});
                        favoritos = resp.ok ? new Set(await resp.json()) : new Set();
                    } catch {
                        favoritos = new Set();
                    }
                }

                async function cargarPokemons() {
                    $EstadoCarga.text('cargando...');
                    if (reqActual && reqActual.abort)
                        reqActual.abort();

                    const params = {nombre: estado.nombre, pagina: estado.pagina, tamanio: estado.tamanio};
                    if (estado.tipos.length)
                        params.tipos = estado.tipos;

                    try {
                        reqActual = $.ajax({url: '/api/pokemons', method: 'GET', traditional: true, data: params});
                        const lista = await reqActual;
                        renderPokemons(lista);
                        $EstadoCarga.text('listo');
                    } catch (e) {
                        if (e?.statusText === 'abort')
                            return;
                        console.error(e);
                        $Contenedor.html('<div class="no-results w-100"><i class="bi bi-exclamation-triangle"></i><div>Error al cargar.</div></div>');
                        $EstadoCarga.text('error');
                    } finally {
                        reqActual = null;
                    }
                }

                function renderPokemons(lista) {
                    $Contenedor.empty();
                    if (!Array.isArray(lista) || lista.length === 0) {
                        $Contenedor.html('<div class="no-results w-100"><i class="bi bi-search"></i><div>No se encontraron Pokémon</div></div>');
                        $InformacionTotal.html('<i class="bi bi-collection me-1"></i>0 Pokémon');
                        $BotonSiguiente.prop('disabled', true);
                        return;
                    }

                    lista.forEach((el, index) => {
                        const numero = String(el?.id ?? 0).padStart(3, '0');
                        const tiposArr = Array.isArray(el?.tipos) ? el.tipos : [];
                        const colores = el?.coloresTipos || {};
                        const tipos = tiposArr.map(t => `<span class="BadgeTipo" style="background:${colores[t] || '#d0ffe0'}">${t}</span>`).join('');
                        const esFavorito = favoritos.has(el.id);
                        const iconoFavorito = esFavorito ? 'bi-star-fill text-warning' : 'bi-star';
                        const titleFav = esFavorito ? 'Quitar de favoritos' : 'Agregar a favoritos';
                        const ariaPressed = esFavorito ? 'true' : 'false';

                        $Contenedor.append(`
                  <div class="ElementoTarjeta" style="animation-delay:${(index * 0.08).toFixed(2)}s">
                    <div class="TarjetaPokemon" style="background:linear-gradient(135deg,${el?.colorPrimario || '#334155'},${el?.colorSecundario || '#1f2937'});">
                      <button type="button" class="btn btn-link BtnFavorito"
                              data-id="${el.id}" title="${titleFav}" aria-pressed="${ariaPressed}" aria-label="Favorito">
                        <i class="bi ${iconoFavorito} fs-4"></i>
                      </button>

                      <div class="MiniaturaPrevia" role="link" tabindex="0" data-href="/pokemon/${el.id}">
                        <img src="${el?.spriteUrl || ''}" alt="${el?.nombre || 'pokemon'}">
                      </div>
                      <div class="MetadatosPokemon" role="link" tabindex="0" data-href="/pokemon/${el.id}">
                        <div>
                          <h5>${el?.nombre || 'Desconocido'}</h5>
                          <div class="TextoSecundario">#${numero}</div>
                        </div>
                        <div class="text-end">${tipos}</div>
                      </div>
                    </div>
                  </div>
                `);
                    });

                    $InformacionTotal.html(`<i class="bi bi-collection me-1"></i>${lista.length} Pokémon`);
                    $InformacionPagina.html(`<i class="bi bi-bookmarks me-2"></i>Página ${estado.pagina + 1}`);
                    $BotonAnterior.prop('disabled', estado.pagina === 0);
                    $BotonSiguiente.prop('disabled', lista.length < estado.tamanio);

                    $('[data-href]').off('click keydown')
                            .on('click', function () {
                                location.href = $(this).data('href');
                            })
                            .on('keydown', function (e) {
                                if (e.key === 'Enter' || e.key === ' ') {
                                    e.preventDefault();
                                    $(this).trigger('click');
                                }
                            });
                }

                const toggling = new Set();
                $('#ContenedorTarjetas').on('click', '.BtnFavorito', async function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const $btn = $(this);
                    const id = Number($btn.data('id'));
                    if (!id || toggling.has(id))
                        return;
                    toggling.add(id);
                    const icon = $btn.find('i');
                    const adding = icon.hasClass('bi-star');
                    const url = adding ? `/api/favoritos/add/${id}` : `/api/favoritos/remove/${id}`;
                    $btn.prop('disabled', true);
                    try {
                        const r = await fetch(url, {method: 'POST', credentials: 'same-origin', headers: {'X-Requested-With': 'XMLHttpRequest'}});
                        if (!r.ok)
                            return;
                        if (adding) {
                            favoritos.add(id);
                            icon.removeClass('bi-star').addClass('bi-star-fill text-warning');
                            $btn.attr('title', 'Quitar de favoritos').attr('aria-pressed', 'true');
                        } else {
                            favoritos.delete(id);
                            icon.removeClass('bi-star-fill text-warning').addClass('bi-star');
                            $btn.attr('title', 'Agregar a favoritos').attr('aria-pressed', 'false');
                        }
                    } finally {
                        $btn.prop('disabled', false);
                        toggling.delete(id);
                    }
                });

                $SelectorTiposMultiples.on('change', function () {
                    estado.tipos = Array.from(this.selectedOptions).map(o => o.value);
                    estado.pagina = 0;
                    cargarPokemons();
                });
                $CampoBusqueda.on('input', function () {
                    clearTimeout(timeoutBusqueda);
                    const valor = this.value.trim();
                    timeoutBusqueda = setTimeout(() => {
                        estado.nombre = valor;
                        estado.pagina = 0;
                        cargarPokemons();
                    }, 250);
                });
                $TamanoPagina.on('change', function () {
                    estado.tamanio = parseInt(this.value, 10) || 12;
                    estado.pagina = 0;
                    cargarPokemons();
                });
                $BotonAnterior.on('click', function () {
                    if (estado.pagina > 0) {
                        estado.pagina--;
                        cargarPokemons();
                    }
                });
                $BotonSiguiente.on('click', function () {
                    estado.pagina++;
                    cargarPokemons();
                });

                (async function init() {
                    await cargarFavoritos();
                    await cargarPokemons();
                })();
            });
        </script>
    </th:block>
</body>
</html>
