<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="UTF-8"/>
        <title th:text="'Pokémon: ' + ${pokemon.name}">Detalle Pokémon</title>
        <style>
            .pokemon-detail-container {
                min-height: 100vh;
                padding: 2rem 1rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }

            .pokemon-card {
                max-width: 1200px;
                margin: 0 auto;
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                border-radius: 28px;
                box-shadow: 0 25px 80px rgba(0,0,0,0.25);
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.3);
                animation: fadeInUp 0.8s ease;
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(40px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .pokemon-hero {
                background: linear-gradient(135deg, #ff6b6b, #ee5a24, #ff9ff3, #54a0ff);
                background-size: 400% 400%;
                animation: gradientShift 8s ease infinite;
                padding: 3.5rem 2.5rem;
                color: white;
                position: relative;
                overflow: hidden;
            }

            @keyframes gradientShift {
                0% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
                100% {
                    background-position: 0% 50%;
                }
            }

            .pokemon-hero::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
                animation: float 6s ease-in-out infinite;
            }

            @keyframes float {
                0%, 100% {
                    transform: translate(-50%, -50%) rotate(0deg);
                }
                50% {
                    transform: translate(-50%, -50%) rotate(180deg);
                }
            }

            .pokemon-header {
                display: grid;
                grid-template-columns: auto 1fr auto;
                gap: 3rem;
                align-items: center;
                position: relative;
                z-index: 1;
            }

            .pokemon-image-container {
                position: relative;
                cursor: pointer;
                transition: all 0.4s ease;
            }

            .pokemon-image-container::before {
                content: '🔊';
                position: absolute;
                top: -10px;
                right: -10px;
                background: rgba(255,255,255,0.9);
                width: 35px;
                height: 35px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.2rem;
                opacity: 0;
                transform: scale(0.8);
                transition: all 0.3s ease;
                z-index: 10;
            }

            .pokemon-image-container:hover::before {
                opacity: 1;
                transform: scale(1);
            }

            .pokemon-image-container::after {
                content: '';
                position: absolute;
                inset: -10px;
                background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
                border-radius: 50%;
                opacity: 0;
                animation: shine 2s ease infinite;
            }

            .pokemon-image-container:hover::after {
                opacity: 1;
            }

            @keyframes shine {
                0% {
                    transform: rotate(0deg) scale(1);
                }
                50% {
                    transform: rotate(180deg) scale(1.1);
                }
                100% {
                    transform: rotate(360deg) scale(1);
                }
            }

            .pokemon-main-image {
                width: 220px;
                height: 220px;
                filter: drop-shadow(0 15px 40px rgba(0,0,0,0.4));
                transition: all 0.4s ease;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
            }

            .pokemon-image-container:hover .pokemon-main-image {
                transform: scale(1.15) rotate(8deg);
                filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5)) saturate(1.2);
            }

            .pokemon-info h1 {
                font-size: 3.5rem;
                font-weight: 800;
                text-transform: capitalize;
                margin: 0;
                text-shadow: 0 4px 12px rgba(0,0,0,0.3);
                background: linear-gradient(45deg, #ffffff, #f0f0f0);
                background-clip: text;
                -webkit-background-clip: text;
            }

            .pokemon-id {
                font-size: 1.4rem;
                opacity: 0.9;
                font-weight: 600;
                background: rgba(255,255,255,0.2);
                padding: 0.5rem 1rem;
                border-radius: 20px;
                display: inline-block;
                margin-top: 0.5rem;
            }

            .pokemon-basic-stats {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
                margin-top: 2rem;
            }

            .basic-stat {
                background: rgba(255,255,255,0.2);
                padding: 1.2rem;
                border-radius: 16px;
                text-align: center;
                backdrop-filter: blur(15px);
                border: 1px solid rgba(255,255,255,0.3);
                transition: all 0.3s ease;
            }

            .basic-stat:hover {
                background: rgba(255,255,255,0.3);
                transform: translateY(-5px);
            }

            .basic-stat-value {
                font-size: 1.8rem;
                font-weight: 700;
                display: block;
                margin-bottom: 0.3rem;
            }

            .basic-stat-label {
                font-size: 0.85rem;
                opacity: 0.9;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: 500;
            }

            .pokemon-types {
                display: flex;
                gap: 0.8rem;
                flex-direction: column;
                align-items: flex-end;
            }

            .type-badge {
                padding: 1rem 1.8rem;
                border-radius: 25px;
                font-size: 1rem;
                font-weight: 700;
                text-transform: capitalize;
                color: white;
                text-shadow: 0 2px 4px rgba(0,0,0,0.4);
                box-shadow: 0 6px 20px rgba(0,0,0,0.25);
                border: 2px solid rgba(255,255,255,0.3);
                backdrop-filter: blur(10px);
                transition: all 0.3s ease;
            }

            .type-badge:hover {
                transform: translateY(-3px) scale(1.05);
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }

            .pokemon-content {
                padding: 3rem;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 2.5rem;
            }

            .section {
                background: rgba(255,255,255,0.85);
                border-radius: 20px;
                padding: 2rem;
                box-shadow: 0 12px 30px rgba(0,0,0,0.12);
                border: 1px solid rgba(0,0,0,0.08);
                transition: all 0.4s ease;
                position: relative;
                overflow: hidden;
            }

            .section::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 3px;
                background: linear-gradient(90deg, transparent, #667eea, transparent);
                transition: left 0.5s ease;
            }

            .section:hover::before {
                left: 100%;
            }

            .section:hover {
                transform: translateY(-8px);
                box-shadow: 0 20px 40px rgba(0,0,0,0.18);
                background: rgba(255,255,255,0.95);
            }

            .section-title {
                font-size: 1.5rem;
                font-weight: 700;
                margin-bottom: 1.5rem;
                color: #2c3e50;
                display: flex;
                align-items: center;
                gap: 0.8rem;
            }

            .section-title i {
                color: #667eea;
                font-size: 1.3rem;
            }

            .abilities-grid {
                display: grid;
                gap: 1rem;
            }

            .ability-item {
                background: linear-gradient(135deg, #667eea, #764ba2);
                color: white;
                padding: 1.3rem;
                border-radius: 15px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            }

            .ability-item:hover {
                transform: translateX(5px);
                box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            }

            .ability-name {
                font-weight: 600;
                text-transform: capitalize;
                font-size: 1.1rem;
            }

            .ability-hidden {
                background: rgba(255,255,255,0.25);
                padding: 0.4rem 1rem;
                border-radius: 25px;
                font-size: 0.8rem;
                font-weight: 600;
                border: 1px solid rgba(255,255,255,0.3);
            }

            .stats-container {
                display: grid;
                gap: 1rem;
            }

            .stat-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;
                background: rgba(102, 126, 234, 0.08);
                border-radius: 12px;
                border-left: 5px solid #667eea;
                transition: all 0.3s ease;
            }

            .stat-item:hover {
                background: rgba(102, 126, 234, 0.15);
                transform: translateX(8px);
            }

            .stat-name {
                font-weight: 600;
                text-transform: capitalize;
                color: #2c3e50;
                font-size: 1rem;
            }

            .stat-value {
                font-weight: 700;
                font-size: 1.3rem;
                color: #667eea;
                background: rgba(102, 126, 234, 0.1);
                padding: 0.3rem 0.8rem;
                border-radius: 8px;
            }

            .audio-player {
                background: linear-gradient(135deg, #667eea, #764ba2);
                border-radius: 16px;
                padding: 1.5rem;
                text-align: center;
                position: relative;
                overflow: hidden;
            }

            .audio-player::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
                animation: float 4s ease-in-out infinite;
            }

            .audio-player audio {
                width: 100%;
                border-radius: 10px;
                position: relative;
                z-index: 1;
            }

            .sprites-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }

            .sprite-item {
                text-align: center;
                background: rgba(102, 126, 234, 0.08);
                border-radius: 16px;
                padding: 1.5rem;
                transition: all 0.3s ease;
                border: 2px solid transparent;
            }

            .sprite-item:hover {
                transform: scale(1.08);
                background: rgba(102, 126, 234, 0.15);
                border-color: rgba(102, 126, 234, 0.3);
            }

            .sprite-item img {
                width: 108px;
                height: 108px;
                filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
                transition: filter 0.3s ease;
            }

            .sprite-item:hover img {
                filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2)) saturate(1.1);
            }

            .sprite-label {
                margin-top: 0.8rem;
                font-size: 0.95rem;
                font-weight: 600;
                color: #667eea;
                text-transform: capitalize;
            }

            .moves-container {
                max-height: 320px;
                overflow-y: auto;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 0.8rem;
                padding-right: 0.5rem;
            }

            .moves-container::-webkit-scrollbar {
                width: 8px;
            }

            .moves-container::-webkit-scrollbar-track {
                background: rgba(0,0,0,0.08);
                border-radius: 4px;
            }

            .moves-container::-webkit-scrollbar-thumb {
                background: #667eea;
                border-radius: 4px;
            }

            .moves-container::-webkit-scrollbar-thumb:hover {
                background: #5a67d8;
            }

            .move-item {
                background: rgba(102, 126, 234, 0.1);
                padding: 0.8rem 1rem;
                border-radius: 25px;
                font-size: 0.9rem;
                text-align: center;
                border: 2px solid rgba(102, 126, 234, 0.2);
                text-transform: capitalize;
                transition: all 0.3s ease;
                font-weight: 500;
            }

            .move-item:hover {
                background: #667eea;
                color: white;
                transform: translateY(-3px);
                box-shadow: 0 6px 15px rgba(102, 126, 234, 0.3);
            }

            .games-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .game-item {
                background: linear-gradient(135deg, #667eea, #764ba2);
                color: white;
                padding: 1rem;
                border-radius: 12px;
                text-align: center;
                font-size: 0.9rem;
                transition: all 0.3s ease;
                border: 2px solid rgba(255,255,255,0.2);
            }

            .game-item:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            }

            .game-name {
                font-weight: 700;
                text-transform: capitalize;
                font-size: 1rem;
            }

            .game-index {
                font-size: 0.85rem;
                opacity: 0.9;
                margin-top: 0.4rem;
                font-weight: 500;
            }

            .back-button {
                position: fixed;
                top: 85px;
                left: 25px;
                background: rgba(255,255,255,0.95);
                border: none;
                border-radius: 50%;
                width: 55px;
                height: 55px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.3rem;
                color: #667eea;
                box-shadow: 0 6px 20px rgba(0,0,0,0.2);
                cursor: pointer;
                transition: all 0.3s ease;
                z-index: 1000;
                backdrop-filter: blur(10px);
                border: 2px solid rgba(102, 126, 234, 0.2);
            }

            .back-button:hover {
                background: white;
                transform: translateY(-3px) scale(1.1);
                box-shadow: 0 10px 30px rgba(0,0,0,0.25);
                color: #5a67d8;
            }

            .forms-list, .species-info {
                background: rgba(102, 126, 234, 0.08);
                border-radius: 12px;
                padding: 1.5rem;
                border: 2px solid rgba(102, 126, 234, 0.1);
                transition: all 0.3s ease;
            }

            .forms-list:hover, .species-info:hover {
                background: rgba(102, 126, 234, 0.15);
                border-color: rgba(102, 126, 234, 0.2);
            }

            .forms-list span, .species-info {
                text-transform: capitalize;
                font-weight: 600;
                color: #2c3e50;
                font-size: 1.05rem;
            }

            .animated-sprites {
                margin-top: 2rem;
                padding: 1.5rem;
                background: rgba(255,255,255,0.1);
                border-radius: 16px;
                backdrop-filter: blur(10px);
            }

            .animated-sprites h3 {
                margin: 0 0 1rem 0;
                font-size: 1.2rem;
                font-weight: 600;
                color: rgba(255,255,255,0.9);
                text-align: center;
            }

            .animated-sprites-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
                justify-items: center;
            }

            .animated-sprites img {
                width: 80px;
                height: 80px;
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
                transition: transform 0.3s ease;
            }

            .animated-sprites img:hover {
                transform: scale(1.2);
            }

            /* Audio oculto para el hover */
            .hidden-audio {
                display: none;
            }

            /* Responsive */
            @media (max-width: 768px) {
                .pokemon-header {
                    grid-template-columns: 1fr;
                    text-align: center;
                    gap: 2rem;
                }

                .pokemon-basic-stats {
                    grid-template-columns: repeat(2, 1fr);
                    gap: 1rem;
                }

                .pokemon-content {
                    grid-template-columns: 1fr;
                    padding: 2rem;
                }

                .pokemon-info h1 {
                    font-size: 2.8rem;
                }

                .sprites-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .animated-sprites-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .back-button {
                    top: 75px;
                    left: 15px;
                    width: 50px;
                    height: 50px;
                }
            }

            @media (max-width: 480px) {
                .pokemon-hero {
                    padding: 2.5rem 1.5rem;
                }

                .pokemon-main-image {
                    width: 180px;
                    height: 180px;
                }

                .pokemon-info h1 {
                    font-size: 2.2rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="pokemon-detail-container" layout:fragment="body">
            <!-- Audio oculto para reproducción en hover -->
            <audio id="pokemonHoverAudio" class="hidden-audio" preload="auto">
                <source th:src="${pokemon.cries.latest}" type="audio/ogg">
                <source th:src="${pokemon.cries.latest}" type="audio/mpeg">
            </audio>

            <!-- Botón de regreso -->
            <button class="back-button" onclick="history.back()" title="Volver">
                <i class="bi bi-arrow-left"></i>
            </button>

            <div class="pokemon-card">
                <!-- Hero Section -->
                <div class="pokemon-hero">
                    <div class="pokemon-header">
                        <div class="pokemon-image-container" id="mainImageContainer">
                            <img th:src="${pokemon.sprites.front_default}" 
                                 th:alt="${pokemon.name}" 
                                 class="pokemon-main-image"/>
                        </div>

                        <div class="pokemon-info">
                            <h1 th:text="${pokemon.name}">Nombre</h1>
                            <div class="pokemon-id">#<span th:text="${pokemon.id}">001</span></div>

                            <div class="pokemon-basic-stats">
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${pokemon.height}">0</span>
                                    <span class="basic-stat-label">Altura</span>
                                </div>
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${pokemon.weight}">0</span>
                                    <span class="basic-stat-label">Peso</span>
                                </div>
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${pokemon.base_experience}">0</span>
                                    <span class="basic-stat-label">Exp. Base</span>
                                </div>
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${#lists.size(pokemon.moves)}">0</span>
                                    <span class="basic-stat-label">Movimientos</span>
                                </div>
                            </div>

                            <!-- Sprites Animados en el Hero -->
                            <div class="animated-sprites">
                                <h3>Sprites Animados (Gen V)</h3>
                                <div class="animated-sprites-grid">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.front_default}" alt="Front Default">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.back_default}" alt="Back Default">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.front_shiny}" alt="Front Shiny">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.back_shiny}" alt="Back Shiny">
                                </div>
                            </div>
                        </div>

                        <div class="pokemon-types">
                            <span th:each="t : ${pokemon.types}" 
                                  class="type-badge"
                                  th:text="${t.type.name}" 
                                  style="background: linear-gradient(135deg, #667eea, #764ba2)"></span>
                        </div>
                    </div>
                </div>

                <!-- Content Sections -->
                <div class="pokemon-content">
                    <!-- Habilidades -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-lightning-charge"></i>
                            Habilidades
                        </h3>
                        <div class="abilities-grid">
                            <div th:each="ab : ${pokemon.abilities}" class="ability-item">
                                <span class="ability-name" th:text="${ab.ability.name}">Habilidad</span>
                                <span th:if="${ab.is_hidden}" class="ability-hidden">Oculta</span>
                            </div>
                        </div>
                    </div>

                    <!-- Estadísticas -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-bar-chart"></i>
                            Estadísticas
                        </h3>
                        <div class="stats-container">
                            <div th:each="s : ${pokemon.stats}" class="stat-item">
                                <span class="stat-name" th:text="${s.stat.name}">Stat</span>
                                <span class="stat-value" th:text="${s.base_stat}">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Sonidos -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-volume-up"></i>
                            Sonidos
                        </h3>
                        <div class="audio-player">
                            <audio controls th:src="${pokemon.cries.latest}">
                                Tu navegador no soporta audio
                            </audio>
                        </div>
                    </div>

                    <!-- Sprites -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-images"></i>
                            Sprites
                        </h3>
                        <div class="sprites-grid">
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.front_default}" alt="Normal"/>
                                <div class="sprite-label">Normal</div>
                            </div>
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.back_default}" alt="Espalda"/>
                                <div class="sprite-label">Espalda</div>
                            </div>
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.front_shiny}" alt="Shiny"/>
                                <div class="sprite-label">Shiny</div>
                            </div>
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.back_shiny}" alt="Shiny Espalda"/>
                                <div class="sprite-label">Shiny Espalda</div>
                            </div>
                        </div>
                    </div>

                    <!-- Movimientos -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-sword"></i>
                            Movimientos
                        </h3>
                        <div class="moves-container">
                            <div th:each="m : ${pokemon.moves}" class="move-item" th:text="${m.move.name}">
                                Movimiento
                            </div>
                        </div>
                    </div>

                    <!-- Juegos -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-joystick"></i>
                            Apariciones
                        </h3>
                        <div class="games-grid">
                            <div th:each="gi : ${pokemon.game_indices}" class="game-item">
                                <div class="game-name" th:text="${gi.version.name}">Juego</div>
                                <div class="game-index">#<span th:text="${gi.game_index}">0</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Formas -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-shuffle"></i>
                            Formas
                        </h3>
                        <div class="forms-list">
                            <span th:each="f, iterStat : ${pokemon.forms}" 
                                  th:text="${f.name} + ${!iterStat.last ? ', ' : ''}">Forma</span>
                        </div>
                    </div>

                    <!-- Especie -->
                    <div class="section">
                        <h3 class="section-title">
                            <i class="bi bi-tree"></i>
                            Especie
                        </h3>
                        <div class="species-info" th:text="${pokemon.species.name}">Especie</div>
                    </div>
                </div>
            </div>
        </div>
    <th:block layout:fragment="scripts">
        <script>
            (() => {
                // Estado
                let audioEl, userActivated = false, throttle = false;

                // Una sola inicialización
                window.addEventListener('DOMContentLoaded', () => {
                    // Audio: usa elemento oculto pero renderizable
                    audioEl = document.getElementById('pokemonHoverAudio');
                    if (audioEl) {
                        audioEl.volume = 0.7;
                        // Desbloquear reproducción tras cualquier click/toque
                        const enableAudio = () => {
                            userActivated = true;
                            document.removeEventListener('pointerdown', enableAudio, true);
                        };
                        document.addEventListener('pointerdown', enableAudio, true);

                        // Mantener estado real por eventos nativos
                        audioEl.addEventListener('ended', () => {
                            throttle = false;
                        });
                        audioEl.addEventListener('pause', () => {
                            throttle = false;
                        });
                    }

                    // Hover/click
                    const mainImageContainer = document.getElementById('mainImageContainer');
                    bindHoverSound(mainImageContainer);

                    document.querySelectorAll('.animated-sprites img, .sprite-item img')
                            .forEach(el => {
                                el.style.cursor = 'pointer';
                                bindHoverSound(el);
                                el.addEventListener('click', () => changeMainImage(el.src));
                            });

                    // Animaciones de entrada
                    initSectionObserver();

                    // Partículas y keyframes solo si existe el hero
                    const hero = document.querySelector('.pokemon-hero');
                    if (hero) {
                        injectOnce('particle-keyframes', particleKeyframesCSS());
                        createParticles(hero, 20);
                    }

                    // Gradiente de fondo con requestAnimationFrame
                    animateBackgroundGradient();

                    // Manejo de errores de imágenes
                    document.querySelectorAll('img').forEach(img => {
                        img.addEventListener('error', function () {
                            this.style.opacity = '0.5';
                            this.alt = 'Imagen no disponible';
                        });
                    });

                    // Accesibilidad
                    improveA11y();
                });

                function bindHoverSound(el) {
                    if (!el || !audioEl)
                        return;
                    el.addEventListener('mouseenter', tryPlayOnce);
                    el.addEventListener('mouseleave', () => {
                        if (!audioEl.paused)
                            audioEl.pause();
                    });
                }

                function tryPlayOnce() {
                    if (!audioEl || !userActivated || throttle)
                        return;
                    throttle = true;
                    audioEl.currentTime = 0;
                    const p = audioEl.play();
                    if (p && typeof p.then === 'function') {
                        p.then(() => setTimeout(() => {
                                throttle = false;
                            }, 900))
                                .catch(() => {
                                    throttle = false;
                                }); // bloqueo por políticas
                    } else {
                        setTimeout(() => {
                            throttle = false;
                        }, 900);
                    }
                }

                function changeMainImage(src) {
                    const img = document.querySelector('.pokemon-main-image');
                    const box = document.getElementById('mainImageContainer');
                    if (!img || !box || !src)
                        return;
                    box.style.transform = 'scale(0.9)';
                    box.style.opacity = '0.7';
                    setTimeout(() => {
                        img.src = src;
                        box.style.transform = 'scale(1)';
                        box.style.opacity = '1';
                    }, 180);
                    tryPlayOnce();
                }

                function initSectionObserver() {
                    injectOnce('slidein-keyframes', `
      .section{opacity:0; transform:translateY(30px);}
      .section.in{opacity:1; transform:translateY(0); transition:all .6s ease;}
    `);
                    const io = new IntersectionObserver(es => {
                        es.forEach(e => {
                            if (e.isIntersecting) {
                                e.target.classList.add('in');
                                io.unobserve(e.target);
                            }
                        });
                    }, {threshold: 0.1, rootMargin: '50px'});
                    document.querySelectorAll('.section').forEach(s => io.observe(s));
                }

                function animateBackgroundGradient() {
                    const el = document.querySelector('.pokemon-detail-container');
                    if (!el)
                        return;
                    let hue = 0;
                    function tick() {
                        hue = (hue + 0.3) % 360;
                        el.style.background = `linear-gradient(135deg, hsl(${hue},70%,60%) 0%, hsl(${(hue + 60) % 360},70%,50%) 100%)`;
                        requestAnimationFrame(tick);
                    }
                    requestAnimationFrame(tick);
                }

                function createParticles(hero, n) {
                    for (let i = 0; i < n; i++) {
                        const p = document.createElement('div');
                        p.style.cssText = `
        position:absolute; width:${Math.random() * 6 + 2}px; height:${Math.random() * 6 + 2}px;
        background:rgba(255,255,255,${Math.random() * 0.5 + 0.1}); border-radius:50%;
        left:${Math.random() * 100}%; top:${Math.random() * 100}%; pointer-events:none;
        animation:floatParticle ${Math.random() * 10 + 10}s infinite linear ${Math.random() * 5}s; z-index:0;`;
                        hero.appendChild(p);
                    }
                }

                function injectOnce(id, css) {
                    if (document.getElementById(id))
                        return;
                    const s = document.createElement('style');
                    s.id = id;
                    s.textContent = css;
                    document.head.appendChild(s);
                }
                function particleKeyframesCSS() {
                    return `
    @keyframes floatParticle {
      0% { transform: translateY(100vh) rotate(0deg); opacity:0; }
      10% { opacity:1; } 90% { opacity:1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity:0; }
    }`;
                }

                function improveA11y() {
                    document.querySelectorAll('.section').forEach((sec, i) => {
                        sec.setAttribute('role', 'region');
                        const h = sec.querySelector('.section-title');
                        if (h) {
                            const id = `section-title-${i}`;
                            h.id = id;
                            sec.setAttribute('aria-labelledby', id);
                        }
                    });
                    document.querySelectorAll('.sprite-item img, .animated-sprites img, .back-button')
                            .forEach(el => {
                                el.setAttribute('tabindex', '0');
                                el.addEventListener('keydown', e => {
                                    if (e.key === 'Enter' || e.key === ' ') {
                                        e.preventDefault();
                                        el.click();
                                    }
                                });
                            });
                }
            })();
        </script>

    </th:block>
</body>
</html>
