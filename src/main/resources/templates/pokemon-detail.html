<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="UTF-8"/>
        <title th:text="'Pokémon: ' + ${pokemon.nombre}">Detalle Pokémon</title>
        <style>
            .pokemon-card {
                max-width: 720px;
                margin: 2rem auto;
                padding: 1.5rem;
                border-radius: 16px;
                box-shadow: 0 6px 16px rgba(0,0,0,0.1);
                background: #fff;
            }
            .pokemon-header {
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .pokemon-header img {
                width: 120px;
                height: 120px;
            }
            .pokemon-types span {
                padding: .25rem .6rem;
                margin-right: .5rem;
                border-radius: 12px;
                font-size: .9rem;
                text-transform: capitalize;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="container py-4" layout:fragment="body">
            <div class="pokemon-card">

                <!-- Cabecera -->
                <div class="pokemon-header">
                    <img th:src="${pokemon.spriteUrl}" th:alt="${pokemon.nombre}"/>
                    <div>
                        <h2 th:text="${pokemon.nombre}">Nombre</h2>
                        <p>ID: <span th:text="${pokemon.id}"></span></p>
                    </div>
                </div>

                <!-- Tipos -->
                <div class="pokemon-types mt-3">
                    <h4>Tipos</h4>
                    <span th:each="tipo : ${pokemon.tipos}"
                          th:text="${tipo}"
                          th:style="'background:'+${pokemon.coloresTipos[tipo]}"></span>
                </div>

                <!-- Colores principales -->
                <div class="mt-3">
                    <h4>Colores</h4>
                    <p><strong>Primario:</strong> <span th:text="${pokemon.colorPrimario}"></span></p>
                    <p><strong>Secundario:</strong> <span th:text="${pokemon.colorSecundario}"></span></p>
                </div>

            </div>
        </div>
    </body>
</html>
