<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="UTF-8"/>
        <title th:text="'Pokémon: ' + ${pokemon.name}">Detalle Pokémon</title>

        <!-- Retro fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=VT323&display=swap" rel="stylesheet"/>

        <style>
            :root{
                --pdx-red:#d32f2f;
                --pdx-red-dark:#9d1818;
                --pdx-red-deep:#6d0f0f;
                --pdx-bezel:#141920;
                --pdx-silver:#cdd6df;
                --pdx-graphite:#2b3140;
                --pdx-amber:#ffd34d;
                --lcd-bg:#0c1a12;
                --lcd-grid:#11261a;
                --lcd-glow:#a8ff78;
                --ink:#0e1218;
                --shadow:0 18px 55px rgba(0,0,0,.35);
                --radius:22px;
            }

            /* ====== BACKDROP ====== */
            .pokemon-detail-container{
                min-height:100vh;
                padding:2rem 1rem;
                /* tablero retro con viñeteado suave */
                background:
                    radial-gradient(1200px 600px at -10% -20%, rgba(255,80,80,.08) 0%, transparent 60%),
                    radial-gradient(1000px 500px at 110% 120%, rgba(255,220,80,.05) 0%, transparent 60%),
                    conic-gradient(from 220deg at 60% 40%, #0c111b, #101727, #0b1220, #0c111b);
            }

            /* ====== SHELL (carcasa Pokédex 2000) ====== */
            .pokemon-card{
                max-width:1200px;
                margin:0 auto;
                border-radius: calc(var(--radius) + 6px);
                position:relative;
                overflow:hidden;
                background:
                    linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.18)) padding-box,
                    linear-gradient(180deg, #ff9a9a, #7e0f0f) border-box;
                border:3px solid transparent;
                box-shadow: var(--shadow);
                isolation:isolate;
            }
            .pokemon-card::before{
                /* tapa roja con degradé plástico */
                content:'';
                position:absolute;
                inset:0;
                background: linear-gradient(180deg, var(--pdx-red) 0%, var(--pdx-red-dark) 60%, var(--pdx-red-deep) 100%);
                z-index:-1;
            }
            .pokemon-card::after{
                /* brillo diagonal */
                content:'';
                position:absolute;
                inset:-30% -20% auto auto;
                height:160%;
                width:55%;
                transform: rotate(15deg);
                background: linear-gradient(90deg, rgba(255,255,255,.2), rgba(255,255,255,0) 45%);
                mix-blend-mode: screen;
                opacity:.25;
                pointer-events:none;
            }

            /* tornillos decorativos */
            .pokemon-card .screw{
                position:absolute;
                width:14px;
                height:14px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #e9eef5 0 40%, #8a96a4 60%, #515a66 100%);
                box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.4);
                z-index:2;
            }
            .screw.s1{
                top:10px;
                left:10px;
            }
            .screw.s2{
                top:10px;
                right:10px;
            }
            .screw.s3{
                bottom:10px;
                left:10px;
            }
            .screw.s4{
                bottom:10px;
                right:10px;
            }

            /* ====== UPPER SCREEN (bezel + LCD) ====== */
            .pokemon-hero{
                background: var(--pdx-bezel);
                padding: 26px 26px 30px;
                border-bottom: 3px solid rgba(0,0,0,.35);
                position:relative;
            }
            .pokemon-hero::after{
                /* LED indicador */
                content:'';
                position:absolute;
                top:18px;
                left:22px;
                width:12px;
                height:12px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #fff, #ffa 40%, #f33 70%);
                box-shadow: 0 0 8px #ff5353, 0 0 20px rgba(255,83,83,.6);
            }

            /* “pantalla” LCD */
            .pokemon-header{
                background:
                    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.35)),
                    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px),
                    radial-gradient(120% 80% at 50% 0%, rgba(168,255,120,.08) 0%, rgba(0,0,0,0) 60%),
                    linear-gradient(180deg, var(--lcd-bg), #07110c);
                border:2px solid #0f2b1c;
                border-radius: 18px;
                padding: 26px;
                display:grid;
                grid-template-columns:auto 1fr auto;
                gap:2rem;
                align-items:center;
                box-shadow: inset 0 0 0 2px rgba(255,255,255,.06), inset 0 0 40px rgba(168,255,120,.08);
            }

            .pokemon-image-container{
                position:relative;
                cursor:pointer;
                transition: transform .25s ease;
                background: radial-gradient(120px 120px at 50% 55%, rgba(255,255,255,.06), transparent 60%);
                border-radius: 18px;
                padding:.5rem;
            }
            .pokemon-image-container::before{
                /* icono mini altavoz como pictograma */
                content:'';
                position:absolute;
                top:-10px;
                right:-10px;
                width:34px;
                height:34px;
                border-radius:50%;
                background:
                    radial-gradient(circle at 30% 30%, #fff, #ddd 40%, #777 70%);
                display:grid;
                place-items:center;
                box-shadow:0 4px 10px rgba(0,0,0,.4);
                mask:
                    radial-gradient(circle at 50% 50%, black 60%, transparent 62%) subtract,
                    linear-gradient(0deg, black 0 100%) intersect;
                opacity:.0;
                transform:scale(.8);
                transition: all .25s ease;
            }
            .pokemon-image-container:hover::before{
                opacity:1;
                transform:scale(1);
            }

            .pokemon-main-image{
                width: 220px;
                height:220px;
                border-radius: 50%;
                filter: drop-shadow(0 16px 36px rgba(0,0,0,.55));
                background: radial-gradient(circle, rgba(255,255,255,.08), transparent 60%);
                transition: transform .25s ease, filter .25s ease;
            }
            .pokemon-image-container:hover .pokemon-main-image{
                transform: scale(1.08) rotate(4deg);
                filter: drop-shadow(0 22px 48px rgba(0,0,0,.6)) saturate(1.1);
            }

            .pokemon-info h1{
                font: 800 3rem/1 'Orbitron', system-ui;
                letter-spacing:.5px;
                margin:0;
                color: #e6ffe4;
                text-shadow:0 2px 14px rgba(168,255,120,.18);
            }
            .pokemon-id{
                display:inline-block;
                margin-top:.35rem;
                font: 700 1.1rem/1 'VT323', monospace;
                letter-spacing:1px;
                color:#b6ffad;
                background: rgba(0,0,0,.35);
                padding:.35rem .8rem;
                border-radius:10px;
                border:1px solid #163e29;
                box-shadow: inset 0 0 10px rgba(168,255,120,.12);
            }

            .pokemon-basic-stats{
                display:grid;
                grid-template-columns: repeat(4,1fr);
                gap:12px;
                margin-top:1.2rem;
            }
            .basic-stat{
                text-align:center;
                padding:.9rem .6rem;
                border-radius:10px;
                background: rgba(168,255,120,.08);
                border:1px solid #163e29;
                box-shadow: inset 0 0 10px rgba(168,255,120,.1);
                transition: transform .2s ease;
            }
            .basic-stat:hover{
                transform: translateY(-4px);
            }
            .basic-stat-value{
                display:block;
                font:700 1.5rem 'VT323', monospace;
                color:#d6ffe0;
            }
            .basic-stat-label{
                font:600 .75rem 'Orbitron', system-ui;
                color:#8ee39a;
                letter-spacing:.8px;
            }

            .pokemon-types{
                display:flex;
                flex-direction:column;
                gap:.6rem;
                align-items:flex-end;
            }
            .type-badge{
                padding:.7rem 1.4rem;
                border-radius:999px;
                color:#0c1116;
                font:700 .95rem/1 'Orbitron',sans-serif;
                text-transform:capitalize;
                background:
                    linear-gradient(180deg, #f7f7f7, #d9dee5);
                border:2px solid #8a95a6;
                box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 6px 12px rgba(0,0,0,.2);
            }

            /* ====== LOWER PANEL (módulos/botones) ====== */
            .pokemon-content{
                padding: 28px;
                background:
                    linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.28));
                display:grid;
                grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
                gap:22px;
            }
            .section{
                position:relative;
                background:
                    linear-gradient(180deg, #f5f7fb, #e8edf4);
                border-radius:14px;
                padding:18px 18px 16px;
                border:1px solid rgba(0,0,0,.08);
                box-shadow: 0 10px 26px rgba(0,0,0,.12), inset 0 0 0 2px rgba(255,255,255,.7);
                transition: transform .2s ease, box-shadow .2s ease;
            }
            .section:hover{
                transform: translateY(-6px);
                box-shadow: 0 16px 34px rgba(0,0,0,.18), inset 0 0 0 2px rgba(255,255,255,.7);
            }
            .section::after{
                content:'';
                position:absolute;
                inset:auto 12px 12px auto;
                width:10px;
                height:10px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #fff, #ffd 40%, #ff6 70%);
                opacity:.6;
                box-shadow:0 0 10px var(--pdx-amber);
            }
            .section-title{
                margin:0 0 12px;
                display:flex;
                align-items:center;
                gap:.6rem;
                font:800 1.1rem 'Orbitron', system-ui;
                color:#1b2430;
                letter-spacing:.6px;
            }
            .section-title i{
                color:#d12b2b;
            }

            .abilities-grid{
                display:grid;
                gap:10px;
            }
            .ability-item{
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:.9rem 1rem;
                border-radius:12px;
                color:#fff;
                background: linear-gradient(180deg, #d12b2b, #9a1c1c);
                border:1px solid rgba(0,0,0,.15);
                box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 8px 18px rgba(209,43,43,.25);
            }
            .ability-name{
                font-weight:700;
                text-transform:capitalize;
            }
            .ability-hidden{
                background: rgba(255,255,255,.2);
                border:1px solid rgba(255,255,255,.35);
                padding:.25rem .7rem;
                border-radius:999px;
                font:700 .75rem 'Orbitron',sans-serif;
            }

            .stats-container{
                display:grid;
                gap:8px;
            }
            .stat-item{
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:.7rem .9rem;
                background: linear-gradient(180deg, #eef3f9, #e6ecf4);
                border-radius:10px;
                border-left:5px solid #a3b1c6;
            }
            .stat-name{
                font-weight:700;
                text-transform:capitalize;
                color:#1e2a38;
            }
            .stat-value{
                font:700 1rem 'VT323', monospace;
                color:#162130;
                background:#dde6f2;
                padding:.2rem .5rem;
                border-radius:6px;
            }

            .audio-player{
                background: linear-gradient(180deg, #2b3140, #1c202b);
                border:2px solid #0f1218;
                border-radius:12px;
                padding:14px;
                text-align:center;
                color:#e6edf3;
                box-shadow: inset 0 0 0 2px rgba(255,255,255,.06);
            }
            .audio-player audio{
                width:100%;
            }

            .sprites-grid{
                display:grid;
                grid-template-columns: repeat(2,1fr);
                gap:14px;
            }
            .sprite-item{
                text-align:center;
                background: linear-gradient(180deg, #eef3f9, #e6ecf4);
                border:1px solid rgba(0,0,0,.06);
                border-radius:12px;
                padding:14px;
                transition: transform .2s ease;
            }
            .sprite-item:hover{
                transform: scale(1.04);
            }
            .sprite-item img{
                width:100px;
                height:100px;
                filter: drop-shadow(0 8px 16px rgba(0,0,0,.18));
            }
            .sprite-label{
                margin-top:.5rem;
                font-weight:700;
                color:#1c2633;
            }

            .moves-container{
                max-height:320px;
                overflow:auto;
                display:grid;
                grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
                gap:8px;
                padding-right:6px;
            }
            .moves-container::-webkit-scrollbar{
                width:8px;
            }
            .moves-container::-webkit-scrollbar-thumb{
                background:#9aa7bd;
                border-radius:4px;
            }

            .move-item{
                text-align:center;
                padding:.6rem .7rem;
                border-radius:999px;
                background: #e9eff7;
                border:1px solid #cbd6e6;
                text-transform:capitalize;
                font-weight:600;
                transition: transform .15s ease, background .15s ease;
            }
            .move-item:hover{
                transform: translateY(-2px);
                background:#dfe8f6;
            }

            .games-grid{
                display:grid;
                grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
                gap:10px;
            }
            .game-item{
                text-align:center;
                color:#fff;
                padding:.8rem;
                border-radius:10px;
                background: linear-gradient(180deg, #2f3545, #1f2430);
                border:1px solid rgba(0,0,0,.2);
            }
            .game-name{
                font:800 .95rem 'Orbitron', system-ui;
                text-transform:capitalize;
            }
            .game-index{
                font:700 .8rem 'VT323', monospace;
                opacity:.9;
                margin-top:.25rem;
            }

            .forms-list, .species-info{
                background:#eef3f9;
                border:1px solid #cfd9e6;
                border-radius:10px;
                padding:1rem;
                color:#14202c;
                font-weight:700;
                text-transform:capitalize;
            }

            /* Sprites animados dentro del LCD */
            .animated-sprites{
                margin-top:1rem;
                padding:1rem;
                background: rgba(0,0,0,.35);
                border-radius:12px;
            }
            .animated-sprites h3{
                margin:0 0 .6rem;
                font:800 1rem 'Orbitron', system-ui;
                color:#baf7b1;
                text-align:center;
                letter-spacing:.6px;
            }
            .animated-sprites-grid{
                display:grid;
                grid-template-columns: repeat(4,1fr);
                gap:10px;
                justify-items:center;
            }
            .animated-sprites img{
                width:80px;
                height:80px;
                filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
            }

            /* Botón volver tipo “Botón A” */
            .back-button{
                position:fixed;
                top:86px;
                left:22px;
                z-index:10;
                width:58px;
                height:58px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #fff, #ddd 40%, #bbb 70%);
                border:2px solid #0f1218;
                color:#1a2330;
                display:grid;
                place-items:center;
                box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 12px 26px rgba(0,0,0,.35);
                cursor:pointer;
                transition: transform .15s ease, filter .15s ease;
            }
            .back-button:hover{
                transform: translateY(-2px) scale(1.06);
                filter: brightness(1.05);
            }

            /* Responsive tweaks */
            @media (max-width: 992px){
                .pokemon-header{
                    grid-template-columns:1fr;
                    gap:1.2rem;
                    text-align:center;
                }
                .pokemon-types{
                    align-items:center;
                }
                .pokemon-info h1{
                    font-size:2.6rem;
                }
                .pokemon-main-image{
                    width:190px;
                    height:190px;
                }
            }
            @media (max-width: 520px){
                .pokemon-basic-stats{
                    grid-template-columns: repeat(2,1fr);
                }
                .animated-sprites-grid{
                    grid-template-columns: repeat(2,1fr);
                }
                .back-button{
                    top:76px;
                    left:12px;
                    width:50px;
                    height:50px;
                }
            }

            /* Oculto, pero mantenemos para lógica */
            .hidden-audio{
                display:none;
            }
        </style>
    </head>
    <body>
        <div class="pokemon-detail-container" layout:fragment="body">
            <!-- Audio oculto para reproducción en hover -->
            <audio id="pokemonHoverAudio" class="hidden-audio" preload="auto">
                <source th:src="${pokemon.cries.latest}" type="audio/ogg">
                <source th:src="${pokemon.cries.latest}" type="audio/mpeg">
            </audio>

            <!-- Botón de regreso -->
            <button class="back-button" onclick="history.back()" title="Volver">
                <i class="bi bi-arrow-left"></i>
            </button>

            <div class="pokemon-card">
                <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>

                <!-- UPPER SCREEN -->
                <div class="pokemon-hero">
                    <div class="pokemon-header">
                        <div class="pokemon-image-container" id="mainImageContainer">
                            <img th:src="${pokemon.sprites.front_default}"
                                 th:alt="${pokemon.name}"
                                 class="pokemon-main-image"/>
                        </div>

                        <div class="pokemon-info">
                            <h1 th:text="${pokemon.name}">Nombre</h1>
                            <div class="pokemon-id">#<span th:text="${pokemon.id}">001</span></div>

                            <div class="pokemon-basic-stats">
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${pokemon.height}">0</span>
                                    <span class="basic-stat-label">Altura</span>
                                </div>
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${pokemon.weight}">0</span>
                                    <span class="basic-stat-label">Peso</span>
                                </div>
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${pokemon.base_experience}">0</span>
                                    <span class="basic-stat-label">Exp. Base</span>
                                </div>
                                <div class="basic-stat">
                                    <span class="basic-stat-value" th:text="${#lists.size(pokemon.moves)}">0</span>
                                    <span class="basic-stat-label">Movimientos</span>
                                </div>
                            </div>

                            <div class="animated-sprites">
                                <h3>Sprites Animados (Gen V)</h3>
                                <div class="animated-sprites-grid">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.front_default}" alt="Front Default">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.back_default}" alt="Back Default">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.front_shiny}" alt="Front Shiny">
                                    <img th:src="${pokemon.sprites.versions.generationV.blackWhite.animated.back_shiny}" alt="Back Shiny">
                                </div>
                            </div>
                        </div>

                        <div class="pokemon-types">
                            <span th:each="t : ${pokemon.types}"
                                  class="type-badge"
                                  th:text="${t.type.name}">type</span>
                        </div>
                    </div>
                </div>

                <!-- LOWER PANELS -->
                <div class="pokemon-content">
                    <!-- Habilidades -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-lightning-charge"></i>Habilidades</h3>
                        <div class="abilities-grid">
                            <div th:each="ab : ${pokemon.abilities}" class="ability-item">
                                <span class="ability-name" th:text="${ab.ability.name}">Habilidad</span>
                                <span th:if="${ab.is_hidden}" class="ability-hidden">Oculta</span>
                            </div>
                        </div>
                    </div>

                    <!-- Estadísticas -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-bar-chart"></i>Estadísticas</h3>
                        <div class="stats-container">
                            <div th:each="s : ${pokemon.stats}" class="stat-item">
                                <span class="stat-name" th:text="${s.stat.name}">Stat</span>
                                <span class="stat-value" th:text="${s.base_stat}">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Sonidos -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-volume-up"></i>Sonidos</h3>
                        <div class="audio-player">
                            <audio controls th:src="${pokemon.cries.latest}">
                                Tu navegador no soporta audio
                            </audio>
                        </div>
                    </div>

                    <!-- Sprites -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-images"></i>Sprites</h3>
                        <div class="sprites-grid">
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.front_default}" alt="Normal"/>
                                <div class="sprite-label">Normal</div>
                            </div>
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.back_default}" alt="Espalda"/>
                                <div class="sprite-label">Espalda</div>
                            </div>
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.front_shiny}" alt="Shiny"/>
                                <div class="sprite-label">Shiny</div>
                            </div>
                            <div class="sprite-item">
                                <img th:src="${pokemon.sprites.back_shiny}" alt="Shiny Espalda"/>
                                <div class="sprite-label">Shiny Espalda</div>
                            </div>
                        </div>
                    </div>

                    <!-- Movimientos -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-sword"></i>Movimientos</h3>
                        <div class="moves-container">
                            <div th:each="m : ${pokemon.moves}" class="move-item" th:text="${m.move.name}">Movimiento</div>
                        </div>
                    </div>

                    <!-- Apariciones -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-joystick"></i>Apariciones</h3>
                        <div class="games-grid">
                            <div th:each="gi : ${pokemon.game_indices}" class="game-item">
                                <div class="game-name" th:text="${gi.version.name}">Juego</div>
                                <div class="game-index">#<span th:text="${gi.game_index}">0</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Formas -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-shuffle"></i>Formas</h3>
                        <div class="forms-list">
                            <span th:each="f, iterStat : ${pokemon.forms}"
                                  th:text="${f.name} + ${!iterStat.last ? ', ' : ''}">Forma</span>
                        </div>
                    </div>

                    <!-- Especie -->
                    <div class="section">
                        <h3 class="section-title"><i class="bi bi-tree"></i>Especie</h3>
                        <div class="species-info" th:text="${pokemon.species.name}">Especie</div>
                    </div>
                </div>
            </div>
        </div>

    <th:block layout:fragment="scripts">
        <script>
            (() => {
                // === LÓGICA ORIGINAL: se conserva tal cual (hover sonido, sprites, observer, etc.) ===
                let audioEl, userActivated = false, throttle = false;

                window.addEventListener('DOMContentLoaded', () => {
                    audioEl = document.getElementById('pokemonHoverAudio');
                    if (audioEl) {
                        audioEl.volume = 0.7;
                        const enableAudio = () => {
                            userActivated = true;
                            document.removeEventListener('pointerdown', enableAudio, true);
                        };
                        document.addEventListener('pointerdown', enableAudio, true);
                        audioEl.addEventListener('ended', () => {
                            throttle = false;
                        });
                        audioEl.addEventListener('pause', () => {
                            throttle = false;
                        });
                    }

                    const mainImageContainer = document.getElementById('mainImageContainer');
                    bindHoverSound(mainImageContainer);

                    document.querySelectorAll('.animated-sprites img, .sprite-item img')
                            .forEach(el => {
                                el.style.cursor = 'pointer';
                                bindHoverSound(el);
                                el.addEventListener('click', () => changeMainImage(el.src));
                            });

                    initSectionObserver();

                    // Fondo: mantenemos animación suave ya existente
                    animateBackgroundGradient();

                    document.querySelectorAll('img').forEach(img => {
                        img.addEventListener('error', function () {
                            this.style.opacity = '0.5';
                            this.alt = 'Imagen no disponible';
                        });
                    });

                    improveA11y();
                });

                function bindHoverSound(el) {
                    if (!el || !audioEl)
                        return;
                    el.addEventListener('mouseenter', tryPlayOnce);
                    el.addEventListener('mouseleave', () => {
                        if (!audioEl.paused)
                            audioEl.pause();
                    });
                }
                function tryPlayOnce() {
                    if (!audioEl || !userActivated || throttle)
                        return;
                    throttle = true;
                    audioEl.currentTime = 0;
                    const p = audioEl.play();
                    (p && p.then) ? p.then(() => setTimeout(() => throttle = false, 900)).catch(() => throttle = false)
                            : setTimeout(() => throttle = false, 900);
                }
                function changeMainImage(src) {
                    const img = document.querySelector('.pokemon-main-image');
                    const box = document.getElementById('mainImageContainer');
                    if (!img || !box || !src)
                        return;
                    box.style.transform = 'scale(0.9)';
                    box.style.opacity = '.7';
                    setTimeout(() => {
                        img.src = src;
                        box.style.transform = 'scale(1)';
                        box.style.opacity = '1';
                    }, 180);
                    tryPlayOnce();
                }
                function initSectionObserver() {
                    const io = new IntersectionObserver(es => {
                        es.forEach(e => {
                            if (e.isIntersecting) {
                                e.target.classList.add('in');
                                io.unobserve(e.target);
                            }
                        });
                    }, {threshold: .1, rootMargin: '50px'});
                    document.querySelectorAll('.section').forEach(s => {
                        s.style.opacity = '0';
                        s.style.transform = 'translateY(30px)';
                        io.observe(s);
                    });
                    const css = `.section.in{opacity:1 !important; transform:translateY(0)!important; transition:all .6s ease;}`;
                    const s = document.createElement('style');
                    s.textContent = css;
                    document.head.appendChild(s);
                }
                function animateBackgroundGradient() {
                    const el = document.querySelector('.pokemon-detail-container');
                    if (!el)
                        return;
                    let hue = 0;
                    function tick() {
                        hue = (hue + .25) % 360;
                        el.style.backgroundImage =
                                `radial-gradient(1200px 600px at -10% -20%, hsla(${(hue + 5) % 360},70%,50%,.08) 0%, transparent 60%),
                   radial-gradient(1000px 500px at 110% 120%, hsla(${(hue + 180) % 360},70%,60%,.05) 0%, transparent 60%),
                   conic-gradient(from 220deg at 60% 40%, #0c111b, #101727, #0b1220, #0c111b)`;
                        requestAnimationFrame(tick);
                    }
                    requestAnimationFrame(tick);
                }
                function improveA11y() {
                    document.querySelectorAll('.section').forEach((sec, i) => {
                        sec.setAttribute('role', 'region');
                        const h = sec.querySelector('.section-title');
                        if (h) {
                            const id = `section-title-${i}`;
                            h.id = id;
                            sec.setAttribute('aria-labelledby', id);
                        }
                    });
                    document.querySelectorAll('.sprite-item img, .animated-sprites img, .back-button')
                            .forEach(el => {
                                el.setAttribute('tabindex', '0');
                                el.addEventListener('keydown', e => {
                                    if (e.key === 'Enter' || e.key === ' ') {
                                        e.preventDefault();
                                        el.click();
                                    }
                                });
                            });
                }
            })();
        </script>
    </th:block>
</body>
</html>
