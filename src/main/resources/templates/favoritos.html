<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Pokédex — Favoritos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <style>
            .GrillaTarjetas {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
                margin-top: 20px;
            }
            .TarjetaPokemon {
                border-radius: 20px;
                overflow: hidden;
                color: #fff;
                position: relative;
                transition: transform 0.2s ease;
                box-shadow: 0 8px 20px rgba(0,0,0,0.2);
                cursor: pointer;
            }
            .TarjetaPokemon:hover {
                transform: translateY(-8px);
            }
            .MiniaturaPrevia {
                height: 200px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255,255,255,0.15);
            }
            .MiniaturaPrevia img {
                max-height: 140px;
                max-width: 140px;
                object-fit: contain;
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            }
            .MetadatosPokemon {
                padding: 15px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .TextoSecundario {
                font-size: 0.9rem;
                opacity: 0.85;
            }
            .BadgeTipo {
                padding: 5px 10px;
                border-radius: 999px;
                font-size: 0.75rem;
                margin-left: 4px;
                text-transform: capitalize;
                color: #fff;
            }
            .extra-info {
                background: rgba(0,0,0,0.2);
                padding: 10px 15px;
                font-size: 0.85rem;
            }
            .stat-bar {
                background: rgba(255,255,255,0.25);
                border-radius: 6px;
                overflow: hidden;
                height: 8px;
                margin-top: 3px;
            }
            .stat-bar-fill {
                height: 100%;
                background: #ffd700;
            }
        </style>
    </head>
    <body layout:fragment="body">
        <div class="container py-4">
            <h2 class="text-white mb-3"><i class="bi bi-star-fill text-warning me-2"></i>Mis Pokémon Favoritos</h2>

            <div class="GrillaTarjetas">
                <!-- Si no hay favoritos -->
                <div th:if="${#lists.isEmpty(pokemons)}" class="no-results w-100 text-center text-light">
                    <i class="bi bi-emoji-frown fs-1"></i>
                    <div class="mt-2">No tienes favoritos aún.</div>
                </div>

                <!-- Tarjetas -->
                <div th:each="el : ${pokemons}" class="ElementoTarjeta">
                    <div class="TarjetaPokemon"
                         th:style="'background:linear-gradient(135deg,'+${el.colorPrimario}+','+${el.colorSecundario}+');'"
                         th:onclick="'window.location.href=\'/pokemon/'+${el.id}+'\''">

                        <!-- Estrella fija -->
                        <button class="btn btn-link text-white fs-4 position-absolute top-0 end-0 m-2" disabled>
                            <i class="bi bi-star-fill text-warning"></i>
                        </button>

                        <!-- Imagen principal: gif si existe -->
                        <div class="MiniaturaPrevia">
                            <img th:src="${el.sprites.versions.generationV.blackWhite.animated.front_default != null ? 
                                 el.sprites.versions.generationV.blackWhite.animated.front_default : 
                                 el.sprites.other.officialArtwork.front_default}"
                                 th:alt="${el.nombre}">
                        </div>

                        <!-- Nombre + tipos -->
                        <div class="MetadatosPokemon">
                            <div>
                                <h5 th:text="${el.nombre}"></h5>
                                <div class="TextoSecundario" th:text="'#'+${el.id}"></div>
                            </div>
                            <div class="text-end">
                                <span th:each="tipo : ${el.tipos}" 
                                      class="BadgeTipo"
                                      th:style="'background:'+${el.coloresTipos[tipo]}"
                                      th:text="${tipo}"></span>
                            </div>
                        </div>

                        <!-- Extra info -->
                        <div class="extra-info">
                            <div><strong>Altura:</strong> <span th:text="${el.height}"></span> dm</div>
                            <div><strong>Peso:</strong> <span th:text="${el.weight}"></span> hg</div>
                            <div><strong>Experiencia base:</strong> <span th:text="${el.base_experience}"></span></div>

                            <div class="mt-2"><strong>Habilidades:</strong>
                                <span th:each="hab : ${el.abilities}" class="badge bg-light text-dark me-1"
                                      th:text="${hab.ability.name}"></span>
                            </div>

                            <div class="mt-2"><strong>Stats:</strong>
                                <div th:each="st : ${el.stats}">
                                    <div class="d-flex justify-content-between">
                                        <span th:text="${st.stat.name}"></span>
                                        <span th:text="${st.base_stat}"></span>
                                    </div>
                                    <div class="stat-bar">
                                        <div class="stat-bar-fill" th:style="'width:'+${st.base_stat}+'%;'"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
