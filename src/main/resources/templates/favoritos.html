<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Pokédex — Favoritos</title>

        <!-- Bootstrap + Icons (del layout) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <!-- Retro fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=VT323&display=swap" rel="stylesheet"/>

        <style>
            :root{
                --pdx-red:#d32f2f;
                --pdx-red-dark:#9d1818;
                --pdx-bezel:#141a22;
                --lcd:#0c161e;
                --lcd-glow:#7fffd4;
                --ink:#0f1520;
                --silver:#cfd7e2;
                --accent:#ffd34d;
                --shadow:0 18px 55px rgba(0,0,0,.35);
                --radius:20px;
            }

            body{
                background: transparent;
            }

            /* ===== Carcasa Pokédex ===== */
            .fav-shell{
                max-width: 1200px;
                margin: 0 auto;
                position: relative;
                border-radius: calc(var(--radius) + 6px);
                overflow: hidden;
                box-shadow: var(--shadow);
                border:3px solid transparent;
                background:
                    linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.18)) padding-box,
                    linear-gradient(180deg, #ff9a9a, #7e0f0f) border-box;
            }
            .fav-shell::before{
                content:'';
                position:absolute;
                inset:0;
                background: linear-gradient(180deg, var(--pdx-red) 0%, var(--pdx-red-dark) 100%);
                z-index:-1;
            }
            .screw{
                position:absolute;
                width:14px;
                height:14px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #e9eef5 0 40%, #8a96a4 60%, #515a66 100%);
                box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.4);
                z-index:2;
            }
            .s1{
                top:10px;
                left:10px;
            }
            .s2{
                top:10px;
                right:10px;
            }
            .s3{
                bottom:10px;
                left:10px;
            }
            .s4{
                bottom:10px;
                right:10px;
            }

            /* ===== Cabecera “LCD” ===== */
            .fav-header{
                background: var(--pdx-bezel);
                padding: 22px 26px;
                border-bottom: 3px solid rgba(0,0,0,.35);
                position:relative;
            }
            .fav-header::after{
                content:'';
                position:absolute;
                top:18px;
                left:20px;
                width:12px;
                height:12px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #fff, #ffa 40%, #f33 70%);
                box-shadow: 0 0 8px #ff5353, 0 0 20px rgba(255,83,83,.6);
            }
            .fav-title{
                display:flex;
                align-items:center;
                gap:.9rem;
                margin:0;
                font: 800 1.35rem/1 'Orbitron', system-ui;
                letter-spacing:.6px;
                color:#e9f7ff;
            }
            .fav-lcd{
                margin-top:12px;
                border-radius:14px;
                padding: 12px 14px;
                background:
                    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35)),
                    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
                    linear-gradient(180deg, var(--lcd), #081018);
                border:2px solid #0e2a38;
                box-shadow: inset 0 0 0 2px rgba(255,255,255,.06), inset 0 0 30px rgba(127,255,212,.10);
                color:#cfefff;
                display:flex;
                justify-content:space-between;
                align-items:center;
                font: 700 1rem/1 'VT323', monospace;
            }

            /* ===== Estado vacío ===== */
            .fav-empty{
                margin: 18px;
                border-radius:14px;
                padding:20px;
                background: linear-gradient(180deg, #f5f7fb, #e8edf4);
                border:1px solid rgba(0,0,0,.08);
                text-align:center;
                color:#223044;
                box-shadow: 0 12px 26px rgba(0,0,0,.12), inset 0 0 0 2px rgba(255,255,255,.7);
            }

            /* ===== Grid de tarjetas ===== */
            .fav-grid{
                padding: 18px;
                display:grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap:16px;
                background: linear-gradient(180deg, rgba(0,0,0,.16), rgba(0,0,0,.28));
            }

            /* Tarjeta módulo */
            .fav-card{
                position:relative;
                display:flex;
                gap:12px;
                align-items:center;
                padding:12px;
                border-radius:14px;
                background: linear-gradient(180deg, #eef3f9, #e6ecf4);
                border:1px solid rgba(0,0,0,.06);
                box-shadow: 0 10px 22px rgba(0,0,0,.12), inset 0 0 0 2px rgba(255,255,255,.7);
                transition: transform .2s ease, box-shadow .2s ease;
                min-height: 110px;
            }
            .fav-card:hover{
                transform: translateY(-4px);
                box-shadow: 0 16px 30px rgba(0,0,0,.18), inset 0 0 0 2px rgba(255,255,255,.7);
            }

            .fav-imgbox{
                width:96px;
                height:96px;
                border-radius:12px;
                background: radial-gradient(80px 80px at 50% 55%, rgba(0,0,0,.06), transparent 60%);
                display:grid;
                place-items:center;
                overflow:hidden;
                border:1px solid rgba(0,0,0,.06);
            }
            .fav-imgbox img{
                width:96px;
                height:96px;
                object-fit:contain;
                filter: drop-shadow(0 6px 12px rgba(0,0,0,.18));
            }

            .fav-data{
                min-width:0;
                flex:1;
            }
            .fav-name{
                margin:0;
                font:800 1rem 'Orbitron', system-ui;
                color:#1b2430;
                text-transform:capitalize;
            }
            .fav-id{
                margin:2px 0 6px;
                font:700 .95rem 'VT323', monospace;
                color:#3a4a5e;
            }
            .fav-types{
                display:flex;
                flex-wrap:wrap;
                gap:6px;
            }
            .fav-type{
                padding:.25rem .55rem;
                border-radius:999px;
                font:700 .75rem 'Orbitron', system-ui;
                text-transform:capitalize;
                background: linear-gradient(180deg, #f7f7f7, #d9dee5);
                border:1px solid #8a95a6;
                color:#0c1116;
            }

            .fav-actions{
                display:flex;
                flex-direction:column;
                gap:6px;
                min-width:112px;
            }
            .btn-cta{
                display:inline-flex;
                align-items:center;
                gap:.4rem;
                justify-content:center;
                padding:.45rem .7rem;
                border-radius:10px;
                text-decoration:none;
                background: linear-gradient(180deg, #2f3647, #1d2330);
                color:#fff;
                border:1px solid rgba(0,0,0,.25);
            }
            .btn-cta:hover{
                filter: brightness(1.05);
            }
            .btn-ghost{
                display:inline-flex;
                align-items:center;
                gap:.4rem;
                justify-content:center;
                padding:.4rem .7rem;
                border-radius:10px;
                background:#fff;
                border:1px dashed #be2c2c;
                color:#be2c2c;
            }
            .btn-ghost:hover{
                background:#ffe9e9;
            }

            /* Responsive acciones en fila */
            @media (max-width:380px){
                .fav-actions{
                    flex-direction:row;
                }
            }
        </style>
    </head>

    <body layout:fragment="body">
        <div class="container py-4">
            <!-- SHELL -->
            <div class="fav-shell">
                <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>

                <!-- Header LCD -->
                <div class="fav-header">
                    <h1 class="fav-title">
                        <i class="bi bi-star-fill text-warning"></i> Mis Pokémon favoritos
                    </h1>
                    <div class="fav-lcd">
                        <span><i class="bi bi-collection me-1"></i> Total: <strong th:text="${#lists.size(pokemons)}">0</strong></span>
                        <span><i class="bi bi-info-circle me-1"></i> Usa “Ver” para abrir el perfil o “Quitar” para eliminar</span>
                    </div>
                </div>

                <!-- Estado vacío -->
                <div class="fav-empty" th:if="${#lists.isEmpty(pokemons)}">
                    <div class="mb-1"><i class="bi bi-heartbreak"></i></div>
                    <div class="fw-bold">Aún no tienes favoritos.</div>
                    <div class="small">Ve al explorador y marca algunos con la estrella.</div>
                </div>

                <!-- Grid de favoritos -->
                <div class="fav-grid" th:if="${!#lists.isEmpty(pokemons)}">
                    <div th:each="el : ${pokemons}" class="fav-card">
                        <!-- Imagen con fallback -->
                        <div class="fav-imgbox"
                             th:with="imgUrl=${el.spriteUrl != null and el.spriteUrl != '' ? el.spriteUrl :
                             (el.sprites != null and el.sprites.other != null and el.sprites.other.officialArtwork != null
                             and el.sprites.other.officialArtwork.front_default != null
                             ? el.sprites.other.officialArtwork.front_default : null)}">
                            <img th:if="${imgUrl != null}" th:src="${imgUrl}" th:alt="${el.nombre}">
                            <span th:if="${imgUrl == null}" class="text-muted small">Sin imagen</span>
                        </div>

                        <!-- Datos -->
                        <div class="fav-data">
                            <h5 class="fav-name" th:text="${el.nombre}">Nombre</h5>
                            <div class="fav-id">#<span th:text="${el.id}">0</span></div>
                            <div class="fav-types">
                                <span th:each="t : ${el.tipos}" class="fav-type" th:text="${t}">tipo</span>
                            </div>
                        </div>

                        <!-- Acciones -->
                        <div class="fav-actions">
                            <a th:href="@{|/pokemon/${el.id}|}" class="btn-cta">
                                <i class="bi bi-box-arrow-up-right"></i> Ver
                            </a>

                            <!-- Quitar de favoritos (POST) -->
                            <form class="js-remove" th:attr="data-id=${el.id}">
                                <button type="submit" class="btn-ghost">
                                    <i class="bi bi-trash"></i> Quitar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- /SHELL -->
        </div>

    <th:block layout:fragment="scripts">
        <script>
            // Mantener lógica: quitar favorito vía POST y recargar.
            document.addEventListener('click', async (e) => {
                const form = e.target.closest('form.js-remove');
                if (!form)
                    return;
                e.preventDefault();
                const id = form.getAttribute('data-id');
                try {
                    const r = await fetch(`/api/favoritos/remove/${id}`, {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {'X-Requested-With': 'XMLHttpRequest'}
                    });
                    if (r.ok)
                        location.reload();
                } catch (_) {
                }
            });
        </script>
    </th:block>
</body>
</html>
