<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pokédex - Filtros</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Bienvenido a la Pokédex</h1>

    <h2>Ver todos los Pokémon</h2>
    <form action="/pokemons" method="get">
        <button type="submit">Ver todos</button>
    </form>

    <h2>Buscar por tipo</h2>
    <form action="/pokemonXNTipo" method="post">
        <label for="types">Tipos (separados por coma):</label>
        <input type="text" id="types" name="types" placeholder="fire,water,grass" />
        <button type="submit">Buscar</button>
    </form>

    <h2>Buscar por nombre</h2>
    <form action="/pokemonXNombre" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="pikachu" />
        <button type="submit">Buscar</button>
    </form>

    <h2>Buscar por especie</h2>
    <form action="/pokemonXEspecie" method="post">
        <label for="especie">Especie:</label>
        <input type="text" id="especie" name="especie" placeholder="pikachu" />
        <button type="submit">Buscar</button>
    </form>

</body>
</html>
