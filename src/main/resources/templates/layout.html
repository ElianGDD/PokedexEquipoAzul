<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title layout:title-pattern="$DECORATOR_TITLE - $CONTENT_TITLE">Pokedex</title>

        <!-- Bootstrap + icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

        <!-- Estilos Pokédex personalizados -->
        <style>
            :root{
                --pokedex-red:#D32F2F;
                --pokedex-dark:#7B0F0F;
                --pokedex-cream:#fff8f2;
                --accent:#F5F5F5;
            }

            /* Layout general */
            body{
                background: linear-gradient(180deg,#fafafa 0%, #f0f0f0 100%);
                min-height:100vh;
            }
            .pokedex-shell{
                max-width:1200px;
                margin:24px auto;
                display:grid;
                grid-template-columns: 320px 1fr;
                gap:20px;
                padding:20px;
            }

            /* Card lateral (pokedex device) */
            .pokedex-aside{
                background: linear-gradient(180deg,var(--pokedex-red),#b71c1c);
                border-radius:16px;
                color:white;
                padding:18px;
                box-shadow: 0 8px 20px rgba(0,0,0,.12);
                display:flex;
                flex-direction:column;
                gap:12px;
                align-items:center;
            }
            .pokedex-top{
                width:100%;
                background:linear-gradient(90deg,#fff 0%, rgba(255,255,255,0.75) 60%);
                border-radius:10px;
                padding:8px;
                display:flex;
                align-items:center;
                justify-content:space-between;
                color:var(--pokedex-dark);
                font-weight:700;
            }
            .pokedex-screen{
                width:100%;
                background:var(--pokedex-cream);
                border-radius:10px;
                padding:12px;
                min-height:220px;
                display:flex;
                flex-direction:column;
                gap:8px;
                align-items:center;
                justify-content:center;
                color:#222;
                box-shadow: inset 0 -6px 16px rgba(0,0,0,0.05);
            }
            .pokedex-controls{
                display:flex;
                gap:8px;
                align-items:center;
                margin-top:6px;
            }
            .pokedex-button{
                width:42px;
                height:42px;
                border-radius:50%;
                background:#fff3;
                border:2px solid rgba(255,255,255,.2);
            }

            /* Main content area */
            .pokedex-main{
                background: white;
                border-radius:16px;
                padding:18px;
                box-shadow: 0 8px 20px rgba(0,0,0,.06);
                min-height:520px;
            }
            .pokedex-header{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:12px;
                margin-bottom:12px;
            }
            .search-input .form-control{
                border-radius:24px;
                padding-left:16px;
            }

            /* Footer small */
            footer.pokedex-footer{
                text-align:center;
                color:#6b6b6b;
                margin-top:18px;
                font-size:0.85rem;
            }

            /* Responsive */
            @media (max-width:991px){
                .pokedex-shell{
                    grid-template-columns: 1fr;
                    padding:12px;
                }
                .pokedex-aside{
                    order:2;
                    width:100%;
                }
                .pokedex-main{
                    order:1;
                }
            }
        </style>
    </head>
    <body>
        <!-- Navbar top reducido -->
        <header class="bg-white border-bottom">
            <nav class="navbar container navbar-expand-lg">
                <a class="navbar-brand fw-bold" href="/" style="color:var(--pokedex-red)">Pokedex</a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div id="nav" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/pokemons">Listado</a></li>
                        <li class="nav-item"><a class="nav-link" href="/about">Acerca</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Shell principal: aside estilo dispositivo + main content -->
        <div class="pokedex-shell container">
            <!-- ASIDE (Pokedex device visual) -->
            <aside class="pokedex-aside">
                <div class="pokedex-top w-100">
                    <div>POKÉDEX</div>
                    <div style="font-size:.85rem; opacity:.9">v1.0</div>
                </div>

                <div class="pokedex-screen w-100 text-center" id="pokedex-screen">
                    <!-- Contenido dinámico del dispositivo (puede llenarse por JS) -->
                    <div>
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="poke" style="height:64px; opacity:.95">
                    </div>
                    <div style="font-weight:700; font-size:1.05rem; text-transform:capitalize">Selecciona un Pokémon</div>
                    <small class="text-muted">Usa la búsqueda o haz click en una tarjeta</small>
                </div>

                <div class="w-100 d-flex justify-content-center pokedex-controls">
                    <div class="pokedex-button"></div>
                    <div class="pokedex-button"></div>
                    <div class="pokedex-button"></div>
                </div>

                <div class="w-100 text-center">
                    <small>Conexión: <span id="pokedex-status" class="badge bg-success">online</span></small>
                </div>
            </aside>

            <!-- MAIN: aquí se inserta el contenido de las vistas -->
            <main class="pokedex-main" layout:fragment="body">
                <!-- Vistas hijas inyectan aquí su contenido -->
            </main>
        </div>

        <!-- Scripts globales y fragment para scripts de vistas -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <th:block layout:fragment="scripts">
        <!-- Vistas pueden inyectar JS aquí -->
    </th:block>

    <footer class="pokedex-footer container">
        <small>© 2025 Pokedex — Diseño inspirado en la Pokédex</small>
    </footer>
</body>
</html>
