<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <title layout:title-pattern="$DECORATOR_TITLE - $CONTENT_TITLE">Pokemon's</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

        <style>
            body {
                margin: 0;
                overflow: hidden;
                height: 100vh;
                background: linear-gradient(
                    to bottom left,
                    #ccefff 0%,
                    #d5fdf4 25%,
                    #d0fcf2 50%,
                    #b9f8ef 75%,
                    #b2f7ef 100%
                    );
                background-size: 100% 100vh;
                background-repeat: no-repeat;
                transform: translateZ(0);
                position: relative;
            }

            .particle {
                position: absolute;
                width: 6px;
                height: 6px;
                background: white;
                border-radius: 50%;
                opacity: 0.8;
                animation: fall linear infinite;
            }

            @keyframes fall {
                0% {
                    transform: translateY(-10vh) translateX(0);
                    opacity: 1;
                }
                100% {
                    transform: translateY(110vh) translateX(20px);
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body >
        <div class="particle" style="left: 10%; animation-duration: 8s; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-duration: 10s; animation-delay: 1s;"></div>
        <div class="particle" style="left: 30%; animation-duration: 12s; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; animation-duration: 7s; animation-delay: 3s;"></div>
        <div class="particle" style="left: 50%; animation-duration: 11s; animation-delay: 2s;"></div>
        <div class="particle" style="left: 60%; animation-duration: 9s; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 70%; animation-duration: 13s; animation-delay: 0.5s;"></div>
        <div class="particle" style="left: 80%; animation-duration: 6s; animation-delay: 4s;"></div>
        <div class="particle" style="left: 90%; animation-duration: 10s; animation-delay: 2.5s;"></div>
        <div class="particle" style="left: 95%; animation-duration: 8s; animation-delay: 3s;"></div>

        <header>
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Pokedex Equipo azul</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    Elegir Tipo
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Action</a></li>
                                    <li><a class="dropdown-item" href="#">Another action</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                                </ul>
                            </li>


                        </ul>
                        <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Buscar pokemon" aria-label="Search"/>
                            <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i></button>
                        </form>
                    </div>
                </div>
            </nav>
        </header>
        <div layout:fragment="body">

        </div>

        <footer class="text-center text-dark py-3" style="background-color: #f8f9fa;">
            <p class="mb-0">© 2025 Pokedex Equipo Azul</p>
        </footer>


    </body>
</html>
