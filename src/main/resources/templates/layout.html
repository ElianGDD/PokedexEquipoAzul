<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title layout:title-pattern="$CONTENT_TITLE">Pokedex</title>

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico.svg">

        <!-- Fuentes -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=VT323&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Bootstrap + Icons optimizados (preload) -->
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style"
              onload="this.onload = null;this.rel = 'stylesheet'">
        <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></noscript>

        <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" as="style"
              onload="this.onload = null;this.rel = 'stylesheet'">
        <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></noscript>

        <style>
            /* ====== Paleta y base “Pokédex 2000s” ====== */
            :root{
                --pdx-red:#d62828;
                --pdx-red-dark:#8b0000;
                --pdx-red-glow:#ff6b6b;
                --pdx-bezel:#1f232b;
                --pdx-lcd-1:#0f1a12;
                --pdx-lcd-2:#0b1410;
                --pdx-green:#9ae66e;
                --pdx-silver:#c9d1d9;
                --radius:18px;
                --shadow:0 12px 28px rgba(0,0,0,.35);
            }

            *{
                box-sizing:border-box;
            }

            html, body{
                height:100%;
                margin:0;
            }

            body{
                font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
                color:#fff;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                /* Carcasa roja */
                background:
                    radial-gradient(1200px 600px at -20% 0%, rgba(255,255,255,.14), transparent 60%),
                    radial-gradient(900px 500px at 120% 100%, rgba(255,255,255,.10), transparent 60%),
                    linear-gradient(145deg, var(--pdx-red) 0%, #b71d1d 42%, var(--pdx-red-dark) 100%);
                min-height:100vh;
            }

            /* ====== Shell / Bezel / LCD ====== */
            .pdx-shell{
                background:
                    linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.18)) padding-box,
                    linear-gradient(180deg, #ffe5e5, #5a0e0e) border-box;
                border:2px solid transparent;
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                position:relative;
            }
            .pdx-shell::before,
            .pdx-shell::after{
                content:'';
                position:absolute;
                width:10px;
                height:10px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #fff, #999 35%, #333 60%);
                box-shadow:0 0 0 2px rgba(0,0,0,.25);
                top:10px;
            }
            .pdx-shell::before{
                left:10px;
            }
            .pdx-shell::after{
                right:10px;
            }

            .pdx-bezel{
                background: linear-gradient(180deg, #3b404b, var(--pdx-bezel));
                border:1px solid #0f1217;
                border-radius: calc(var(--radius) - 6px);
                padding:10px 12px;
            }

            .pdx-screen{
                background:
                    repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px),
                    linear-gradient(180deg, var(--pdx-lcd-1), var(--pdx-lcd-2) 60%, #061008);
                color:var(--pdx-green);
                border:2px solid #0c2015;
                border-radius:14px;
                padding:12px;
                font-family: 'VT323', monospace;
                letter-spacing:.3px;
            }

            .pdx-led{
                display:inline-block;
                width:10px;
                height:10px;
                border-radius:50%;
                background: radial-gradient(circle at 30% 30%, #fff, var(--pdx-red-glow) 40%, #a20000 70%);
                box-shadow: 0 0 6px 2px var(--pdx-red-glow);
                margin-left:.5rem;
            }

            .pdx-grill{
                width:90px;
                height:12px;
                border-radius:8px;
                background:
                    repeating-linear-gradient(90deg, #000 0 6px, #333 6px 10px);
                opacity:.35;
                border:1px solid #0006;
            }

            /* ====== Header ====== */
            header.site-header{
                position:fixed;
                top:10px;
                left:10px;
                right:10px;
                z-index:1050;
            }
            header.site-header .navbar{
                background:transparent;
                padding:0;
            }
            .site-brand{
                color:#fff;
                text-decoration:none;
                display:flex;
                align-items:center;
                gap:.6rem;
                font-family:'Orbitron', sans-serif;
                font-weight:800;
                letter-spacing:.6px;
                text-transform:uppercase;
            }
            .site-brand:hover{
                color:#fff;
                opacity:.9;
            }

            .navbar-toggler{
                border-color: #ffffff55;
                color:#fff;
            }
            .navbar-toggler-icon{
                background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255,255,255,0.85%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
            }
            .navbar-nav .nav-link{
                color:#fff;
                opacity:.9;
                font-weight:600;
                border-radius:10px;
                padding:.5rem .75rem;
            }
            .navbar-nav .nav-link:hover{
                background:#ffffff1a;
                color:#fff;
            }

            /* ====== Layout ====== */
            .main-container{
                width:100%;
                min-height:100vh;
                padding-top:110px; /* header fijo + margen */
            }
            main.pokedex-main{
                background:transparent;
                border-radius:0;
                padding:0;
                box-shadow:none;
                width:100%;
                min-height: calc(100vh - 110px);
                margin:0;
            }
            .view-body{
                width:100%;
                min-height: calc(100vh - 110px);
            }

            /* Footer estilo placa */
            footer.layout-footer{
                position:fixed;
                bottom:10px;
                right:10px;
                background: linear-gradient(180deg, #ffffff22, #00000033);
                border:1px solid #ffffff22;
                color:#ffffff99;
                padding:6px 10px;
                border-radius:10px;
                font-size:.78rem;
                backdrop-filter: blur(8px);
                box-shadow: var(--shadow);
            }

            /* Mobile */
            @media (max-width: 991px){
                header.site-header{
                    position:relative;
                    top:0;
                    left:0;
                    right:0;
                    margin:10px;
                }
                .main-container{
                    padding-top:10px;
                }
                main.pokedex-main, .view-body{
                    min-height:auto;
                }
                .navbar-collapse{
                    background:#000000d0;
                    border-radius:12px;
                    margin-top:.75rem;
                    padding:1rem;
                    border:1px solid #ffffff22;
                }
                footer.layout-footer{
                    position:relative;
                    bottom:auto;
                    right:auto;
                    margin:16px auto 10px;
                    text-align:center;
                }
            }

            /* Utilidades */
            .muted{
                color:#cfd2d6;
                opacity:.75;
            }
            .container, .container-fluid{
                max-width:none !important;
                padding:0 !important;
            }

            /* Encapsulado del header dentro de bezel + lcd */
            .pdx-bar{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:1rem;
            }
            .pdx-bar-left{
                display:flex;
                align-items:center;
                gap:1rem;
            }
            .pdx-bar-right{
                display:flex;
                align-items:center;
                gap:1rem;
            }
        </style>

        <!-- Fragmento adicional para CSS específico -->
    <th:block layout:fragment="styles"></th:block>
</head>

<body>
    <!-- Header fijo estilo Pokédex -->
    <header class="site-header pdx-shell">
        <div class="pdx-bezel">
            <div class="pdx-screen">
                <nav class="navbar container-fluid navbar-expand-lg p-0">
                    <div class="w-100 pdx-bar">
                        <div class="pdx-bar-left">
                            <a class="navbar-brand site-brand" href="/" aria-label="Pokedex">
                                <i class="bi bi-controller"></i>
                                POKÉDEX
                            </a>
                            <span class="pdx-led" title="POWER"></span>
                        </div>

                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                                aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                            <ul class="navbar-nav align-items-center">
                                <li class="nav-item me-2">
                                    <a class="nav-link" href="/pokemons">
                                        <i class="bi bi-grid-3x3-gap me-1"></i> Explorar
                                    </a>
                                </li>
                                <li class="nav-item me-3">
                                    <a class="nav-link" th:href="@{/api/favoritos/vista}">
                                        <i class="bi bi-heart me-1"></i> Favoritos
                                    </a>
                                </li>
                                <li class="d-none d-md-block">
                                    <span class="pdx-grill" aria-hidden="true"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Container principal -->
    <div class="main-container">
        <main class="pokedex-main" layout:fragment="body">
            <div class="view-body muted">
                El contenido específico de la vista se inyecta aquí.
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="layout-footer">
        <small style="font-family:'Orbitron',sans-serif; letter-spacing:.5px;">
            <i class="bi bi-c-circle me-1"></i>
            <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Pokédex
        </small>
    </footer>

    <!-- Scripts al final -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Fragmento adicional para scripts específicos -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
