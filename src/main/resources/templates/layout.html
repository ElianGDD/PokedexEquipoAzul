<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title layout:title-pattern="$DECORATOR_TITLE - $CONTENT_TITLE">Pokedex</title>

        <!-- Fonts + Bootstrap + icons -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

        <style>
            :root{
                --pokedex-red:#D32F2F;
                --pokedex-dark:#6b0d0d;
                --pokedex-cream:#fff8f2;
                --surface:#ffffff;
                --muted:#6b6b6b;
                --glass: rgba(255,255,255,0.6);
            }

            *{
                box-sizing:border-box;
                font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
            }

            body{
                background: linear-gradient(180deg,#f6f7fb 0%, #eef2f6 100%);
                margin:0;
                -webkit-font-smoothing:antialiased;
                -moz-osx-font-smoothing:grayscale;
                min-height:100vh;
                color:#222;
            }

            /* Top navbar */
            .site-nav{
                background:transparent;
                border-bottom:0;
                padding:12px 0;
            }
            .site-brand{
                color:var(--pokedex-red);
                font-weight:700;
                letter-spacing:.6px;
                font-size:1.15rem;
            }
            .nav-search{
                min-width:320px;
                max-width:420px;
            }
            @media (max-width:767px){
                .nav-search{
                    display:none;
                }
            }

            /* Shell */
            .pokedex-shell{
                max-width:1200px;
                margin:28px auto;
                display:grid;
                grid-template-columns: 300px 1fr;
                gap:20px;
                padding:20px;
            }

            /* Aside device */
            .pokedex-aside{
                background: linear-gradient(180deg,var(--pokedex-red),#b71c1c);
                border-radius:14px;
                color:white;
                padding:18px;
                box-shadow: 0 10px 30px rgba(15,15,15,0.08);
                display:flex;
                flex-direction:column;
                gap:14px;
                align-items:center;
            }
            .pokedex-top{
                width:100%;
                background:linear-gradient(90deg,#fff 0%, rgba(255,255,255,0.72) 60%);
                border-radius:10px;
                padding:8px;
                display:flex;
                align-items:center;
                justify-content:space-between;
                color:var(--pokedex-dark);
                font-weight:700;
                font-size:.95rem;
            }
            .pokedex-screen{
                width:100%;
                background:var(--pokedex-cream);
                border-radius:12px;
                padding:14px;
                min-height:220px;
                display:flex;
                flex-direction:column;
                gap:8px;
                align-items:center;
                justify-content:center;
                color:#222;
                box-shadow: inset 0 -6px 16px rgba(0,0,0,0.05);
                text-align:center;
            }
            .pokedex-screen img{
                height:72px;
                filter:drop-shadow(0 6px 18px rgba(0,0,0,0.06));
            }

            .pokedex-controls{
                display:flex;
                gap:8px;
                margin-top:6px;
            }
            .pokedex-button{
                width:44px;
                height:44px;
                border-radius:50%;
                background:rgba(255,255,255,0.12);
                border:1px solid rgba(255,255,255,0.18);
            }

            /* Main */
            .pokedex-main{
                background:var(--surface);
                border-radius:14px;
                padding:20px;
                box-shadow: 0 10px 30px rgba(15,15,15,0.04);
                min-height:520px;
                display:flex;
                flex-direction:column;
            }
            .pokedex-header{
                display:flex;
                gap:12px;
                align-items:center;
                justify-content:space-between;
                margin-bottom:14px;
            }
            .search-input .form-control{
                border-radius:999px;
                padding-left:16px;
                min-width:220px;
            }

            footer.pokedex-footer{
                text-align:center;
                color:var(--muted);
                margin:28px 0 48px;
                font-size:.9rem;
            }

            /* Responsive */
            @media (max-width:991px){
                .pokedex-shell{
                    grid-template-columns: 1fr;
                    padding:12px;
                }
                .pokedex-aside{
                    order:2;
                    width:100%;
                }
                .pokedex-main{
                    order:1;
                }
            }
        </style>
    </head>
    <body>
        <header class="site-header bg-white border-bottom">
            <nav class="navbar container navbar-expand-lg site-nav">
                <a class="navbar-brand site-brand me-3" href="/" aria-label="Pokedex">Pokedex</a>

                <div class="collapse navbar-collapse d-flex align-items-center">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link" href="/pokemons">Listado</a></li>
                        <li class="nav-item"><a class="nav-link" href="/about">Acerca</a></li>
                    </ul>
                </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".navbar-collapse" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </nav>
        </header>

        <div class="pokedex-shell container">
            <aside class="pokedex-aside" aria-labelledby="deviceTitle">
                <div class="pokedex-top w-100">
                    <div id="deviceTitle">POKÉDEX</div>
                    <div style="font-size:.85rem; opacity:.95">v1.0</div>
                </div>

                <div class="pokedex-screen w-100" id="pokedex-screen" role="region" aria-live="polite">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Pokeball"/>
                    <div style="font-weight:700; font-size:1.05rem; text-transform:capitalize">Selecciona un Pokémon</div>
                    <small class="text-muted">Usa la búsqueda o selecciona una tarjeta</small>
                </div>

                <div class="w-100 d-flex justify-content-center pokedex-controls">
                    <div class="pokedex-button" title="A"></div>
                    <div class="pokedex-button" title="B"></div>
                    <div class="pokedex-button" title="C"></div>
                </div>

                <div class="w-100 text-center">
                    <small>Conexión: <span id="pokedex-status" class="badge bg-success">online</span></small>
                </div>
            </aside>

            <main class="pokedex-main" layout:fragment="body">
                <!-- Vistas inyectan contenido -->
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <th:block layout:fragment="scripts"></th:block>

    <footer class="pokedex-footer container">
        <small>© 2025 Pokedex — Diseño inspirado en la Pokédex</small>
    </footer>
</body>
</html>
