<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title layout:title-pattern="$CONTENT_TITLE">Pokedex</title>

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico.svg">

        <!-- Fuentes -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Bootstrap + Icons optimizados (preload) -->
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style"
              onload="this.onload = null;this.rel = 'stylesheet'">
        <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></noscript>

        <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" as="style"
              onload="this.onload = null;this.rel = 'stylesheet'">
        <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></noscript>

        <style>
            :root{
                --bg-1: #0f1724;
                --bg-2: #0b1220;
                --card: #ffffff;
                --muted: #8a8f98;
                --accent: #d32f2f;
                --glass: rgba(255,255,255,0.06);
                --radius: 14px;
                --max-width: 1400px;
                --gap: 20px;
                --shadow-1: 0 8px 30px rgba(2,6,23,0.24);
            }

            * {
                box-sizing: border-box;
                font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            }

            html, body {
                height: 100%;
                margin: 0;
                color: #fff;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 0;
                margin: 0;
            }

            /* Header simplificado para no interferir */
            header.site-header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 1050;
                background: rgba(0,0,0,0.1);
                backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(255,255,255,0.1);
                padding: 0;
            }

            .navbar {
                background: transparent;
                padding: 0.75rem 1rem;
                min-height: 60px;
            }

            .site-brand {
                color: #fff;
                font-weight: 700;
                letter-spacing: 0.6px;
                font-size: 1.25rem;
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .site-brand:hover {
                color: #fff;
                opacity: 0.8;
            }

            .navbar-nav .nav-link {
                color: rgba(255,255,255,0.8);
                font-weight: 500;
                padding: 0.5rem 1rem;
                border-radius: 8px;
                transition: all 0.3s ease;
            }

            .navbar-nav .nav-link:hover {
                color: #fff;
                background: rgba(255,255,255,0.1);
            }

            .navbar-toggler {
                border-color: rgba(255,255,255,0.2);
                color: #fff;
            }

            .navbar-toggler-icon {
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.8%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
            }

            /* Container principal que ocupa toda la pantalla */
            .main-container {
                width: 100%;
                min-height: 100vh;
                padding-top: 60px; /* Espacio para el header fijo */
            }

            /* Contenido principal sin restricciones */
            main.pokedex-main {
                background: transparent;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
                min-height: calc(100vh - 60px);
                width: 100%;
                margin: 0;
            }

            .view-body {
                margin: 0;
                padding: 0;
                width: 100%;
                min-height: calc(100vh - 60px);
            }

            /* Footer opcional y discreto */
            footer.layout-footer {
                position: fixed;
                bottom: 10px;
                right: 10px;
                background: rgba(0,0,0,0.3);
                color: rgba(255,255,255,0.6);
                padding: 8px 12px;
                border-radius: 8px;
                font-size: 0.75rem;
                backdrop-filter: blur(10px);
                z-index: 1040;
                border: 1px solid rgba(255,255,255,0.1);
            }

            /* Estilos responsivos mejorados */
            @media (max-width: 991px) {
                header.site-header {
                    position: relative;
                }

                .main-container {
                    padding-top: 0;
                }

                main.pokedex-main {
                    min-height: auto;
                }

                .view-body {
                    min-height: auto;
                }

                footer.layout-footer {
                    position: relative;
                    bottom: auto;
                    right: auto;
                    margin: 20px auto;
                    text-align: center;
                    background: rgba(0,0,0,0.2);
                    max-width: 300px;
                }
            }

            @media (max-width: 576px) {
                .navbar {
                    padding: 0.5rem;
                }

                .site-brand {
                    font-size: 1.1rem;
                }
            }

            /* Utilidades */
            .muted {
                color: var(--muted);
            }

            .badge-accent {
                background: var(--accent);
                color: white;
                border-radius: 999px;
                padding: 6px 10px;
                font-weight: 600;
            }

            /* Asegurar que el contenido hijo pueda usar toda la altura */
            [layout\:fragment="body"] {
                width: 100%;
                min-height: calc(100vh - 60px);
            }

            /* Override para contenedores de Bootstrap si es necesario */
            .container, .container-fluid {
                max-width: none !important;
                padding: 0 !important;
            }

            /* Ajuste específico para el listado de Pokemon */
            .container.py-4 {
                padding: 1.5rem !important;
                max-width: none !important;
            }

            /* Mejoras para el navbar en mobile */
            @media (max-width: 991px) {
                .navbar-collapse {
                    background: rgba(0,0,0,0.9);
                    border-radius: 8px;
                    margin-top: 10px;
                    padding: 1rem;
                    border: 1px solid rgba(255,255,255,0.1);
                }
            }
        </style>

        <!-- Fragmento adicional para CSS específico -->
    <th:block layout:fragment="styles"></th:block>
</head>

<body>
    <!-- Header fijo y discreto -->
    <header class="site-header">
        <nav class="navbar container-fluid navbar-expand-lg">
            <a class="navbar-brand site-brand" href="/" aria-label="Pokedex">
                <i class="bi bi-controller"></i>
                Pokédex
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/pokemons">
                            <i class="bi bi-grid-3x3-gap me-1"></i>
                            Explorar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/api/favoritos/vista}">
                            <i class="bi bi-heart me-1"></i>
                            Favoritos
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Container principal que permite ocupar toda la pantalla -->
    <div class="main-container">
        <main class="pokedex-main" layout:fragment="body">
            <div class="view-body muted">
                El contenido específico de la vista se inyecta aquí.
            </div>
        </main>
    </div>

    <!-- Footer discreto -->
    <footer class="layout-footer">
        <small>
            <i class="bi bi-c-circle me-1"></i>
            <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> 
            Pokédex
        </small>
    </footer>

    <!-- Scripts al final para no bloquear -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Fragmento adicional para scripts específicos -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
