<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title layout:title-pattern="$DECORATOR_TITLE - $CONTENT_TITLE">Pokedex</title>

        <!-- Fonts, bootstrap & icons -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <style>
            :root{
                --bg-1: #0f1724;
                --bg-2: #0b1220;
                --card: #ffffff;
                --muted: #8a8f98;
                --accent: #d32f2f;
                --glass: rgba(255,255,255,0.06);
                --radius: 14px;
                --max-width: 1200px;
                --gap: 20px;
                --shadow-1: 0 8px 30px rgba(2,6,23,0.24);
            }

            /* base */
            *{
                box-sizing: border-box;
                font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            }
            html,body{
                height:100%;
                margin:0;
                color:#0b1320;
                -webkit-font-smoothing:antialiased;
                -moz-osx-font-smoothing:grayscale;
            }

            body{
                background-image: url('https://wallpapers.com/images/featured/pokemon-hd-fazqcs1tmwwte1ap.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                min-height:100vh;
                padding:24px 16px;
                display:flex;
                justify-content:center;
                align-items:flex-start;
            }
             
            .container-shell{
                width:100%;
                max-width:var(--max-width);
                display:grid;
                grid-template-columns: 320px 1fr;
                gap:var(--gap);
                align-items:start;
            }

            /* NAVBAR (top of layout) */
            header.site-header{
                grid-column: 1 / -1;
                margin-bottom: 6px;
            }
            .navbar{
                background: transparent;
                padding: .45rem 0;
            }
            .site-brand{
                color:var(--accent);
                font-weight:700;
                letter-spacing:.6px;
                font-size:1.15rem;
            }

            /* ASIDE (device) */
            .pokedex-aside{
                background: linear-gradient(180deg,var(--accent), #b71c1c);
                border-radius:var(--radius);
                color:white;
                padding:18px;
                box-shadow: var(--shadow-1);
                display:flex;
                flex-direction:column;
                gap:14px;
                align-items:center;
                min-height:420px;
            }
            .pokedex-top{
                width:100%;
                background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.72) 60%);
                border-radius:10px;
                padding:8px;
                color:#3b0b0b;
                font-weight:700;
                display:flex;
                justify-content:space-between;
                align-items:center;
                font-size:.95rem;
            }
            .pokedex-screen{
                width:100%;
                background: #fff7f3;
                border-radius:12px;
                padding:14px;
                min-height:210px;
                display:flex;
                flex-direction:column;
                gap:6px;
                align-items:center;
                justify-content:center;
                text-align:center;
                color:#221;
                box-shadow: inset 0 -6px 10px rgba(0,0,0,0.04);
            }
            .pokedex-screen img{
                height:68px;
                filter: drop-shadow(0 6px 18px rgba(0,0,0,0.06));
            }

            .pokedex-controls{
                display:flex;
                gap:8px;
            }
            .pokedex-button{
                width:44px;
                height:44px;
                border-radius:50%;
                background:rgba(255,255,255,0.12);
                border:1px solid rgba(255,255,255,0.18);
            }

            /* MAIN (content area) */
            main.pokedex-main{
                background: linear-gradient(180deg, rgba(255,255,255,0.9), var(--card));
                border-radius:var(--radius);
                padding:18px;
                box-shadow: 0 18px 48px rgba(8,12,20,0.06);
                min-height:520px;
                display:flex;
                flex-direction:column;
                gap:12px;
            }

            .main-header{
                display:flex;
                gap:12px;
                align-items:center;
                justify-content:space-between;
            }
            .controls-row{
                display:flex;
                gap:12px;
                align-items:center;
                flex-wrap:wrap;
            }

            /* content wrapper fragment area */
            .view-body{
                margin-top:4px;
                display:block;
            }

            /* footer */
            footer.layout-footer{
                grid-column: 1 / -1;
                margin-top:18px;
                text-align:center;
                color:var(--muted);
                font-size:.9rem;
            }

            /* responsiveness */
            @media (max-width: 991px){
                .container-shell{
                    grid-template-columns: 1fr;
                    padding:8px;
                }
                .pokedex-aside{
                    order:2;
                    width:100%;
                }
                .pokedex-main{
                    order:1;
                }
                header.site-header{
                    display:block;
                    margin-bottom:8px;
                }
            }

            /* utility */
            .muted {
                color:var(--muted);
            }
            .badge-accent{
                background:var(--accent);
                color:white;
                border-radius:999px;
                padding:6px 10px;
                font-weight:600;
            }
        </style>
    </head>

    <body>
        <div class="container-shell">

            <!-- header (spans full width of layout) -->
            <header class="site-header">
                <nav class="navbar container navbar-expand-lg">
                    <a class="navbar-brand site-brand" href="/" aria-label="Pokedex">Pokedex</a>

                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto align-items-center">
                            <li class="nav-item"><a class="nav-link" href="/pokemons">Listado</a></li>
                            <li class="nav-item"><a class="nav-link" href="/about">Acerca</a></li>
                        </ul>
                    </div>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".navbar-collapse" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </nav>
            </header>

           

            <!-- MAIN: fragment where each view injects its content -->
            <main class="pokedex-main" layout:fragment="body">
                <!-- Vistas (por ejemplo pokemons.html) insertan su contenido en este fragment -->
                <div class="view-body muted">El contenido específico de la vista se inyecta aquí (fragmento `body`).</div>
            </main>

            <!-- footer (spans full width) -->
            <footer class="layout-footer">
                <small>© <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Pokedex — Diseño inspirado en la Pokédex</small>
            </footer>
        </div>

        <!-- bootstrap bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Lugar para scripts inyectados por vistas -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
